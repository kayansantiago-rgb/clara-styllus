name: Instalador Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Instalar NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Gerar instalador
        run: bash instalador/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClaraStyllus-PDV-Setup
          path: |
            dist/*.exe
            dist/*.sha256
      - name: Publicar versão (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.sha256 --title "Clara Styllus PDV $GITHUB_REF_NAME" --generate-notes
