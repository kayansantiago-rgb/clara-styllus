<!doctype html>
<html lang="pt-BR">
<head>

    <div class="marca">

      <a href="#/produtos" data-rota="produtos"><span class="ico">👗</span>Produtos</a>
      <a href="#/etiquetas" data-rota="etiquetas"><span class="ico">🏷️</span>Etiquetas</a>
      <a href="#/inventario" data-rota="inventario"><span class="ico">📋</span>Inventário</a>
      <a href="#/vendas" data-rota="vendas"><span class="ico">🧾</span>Vendas</a>
      <a href="#/condicional" data-rota="condicional"><span class="ico">👜</span>Condicional</a>
      <a href="#/crediario" data-rota="crediario"><span class="ico">📒</span>Crediário</a>

      <a href="#/config" data-rota="config" data-admin><span class="ico">⚙️</span>Configurações</a>
    </nav>

    <a class="status-caixa" id="status-caixa" href="#/caixa" title="Abrir / fechar o caixa"></a>
  </aside>

  <main id="conteudo"></main>

  <div id="modal-fundo" class="modal-fundo" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header><h2 id="modal-titulo"></h2><button class="fechar" data-fechar aria-label="Fechar">×</button></header>
      <div id="modal-corpo"></div>
    </div>
  </div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <iframe id="frame-impressao" title="impressão" tabindex="-1"></iframe>

  <script src="/js/barcode.js"></script>
