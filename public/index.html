<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clara Styllus · PDV</title>
  <link rel="icon" type="image/png" href="/img/icone.png">
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <script>try { if (localStorage.getItem('tema') === 'escuro') document.documentElement.classList.add('escuro'); } catch (e) { /* tema claro */ }</script>
</head>
<body>
  <div id="abertura" aria-hidden="true">
    <div class="abertura-meio"><img src="/img/logo.png" alt=""><span class="abertura-barra"><i></i></span></div>
  </div>
  <script>try { if (sessionStorage.getItem('abertura')) document.getElementById('abertura').remove(); else sessionStorage.setItem('abertura', '1'); } catch (e) { /* sem sessão: mostra */ }</script>
  <aside class="menu">
    <div class="marca">
      <span class="marca-logo"><img src="/img/cs.png" alt="CS"></span>
      <span class="marca-txt"><span class="marca-nome">Clara Styllus</span><span class="marca-sub">Ponto de venda</span></span>
    </div>
    <nav>
      <a href="#/inicio" data-rota="inicio" data-admin><i data-icone="inicio"></i>Início</a>
      <a href="#/pdv" data-rota="pdv"><i data-icone="sacola"></i>Vender <kbd>F1</kbd></a>
      <div class="menu-titulo">Loja</div>
      <a href="#/produtos" data-rota="produtos"><i data-icone="roupa"></i>Produtos</a>
      <a href="#/etiquetas" data-rota="etiquetas"><i data-icone="etiqueta"></i>Etiquetas</a>
      <a href="#/inventario" data-rota="inventario"><i data-icone="prancheta"></i>Inventário</a>
      <div class="menu-titulo">Vendas</div>
      <a href="#/vendas" data-rota="vendas"><i data-icone="recibo"></i>Vendas</a>
      <a href="#/condicional" data-rota="condicional"><i data-icone="bolsa"></i>Condicional<span class="menu-bolinha alerta" data-bolinha="condicional" hidden></span></a>
      <a href="#/reservas" data-rota="reservas"><i data-icone="reserva"></i>Reservas<span class="menu-bolinha alerta" data-bolinha="reservas" hidden></span></a>
      <a href="#/pedidos" data-rota="pedidos"><i data-icone="nuvem"></i>Pedidos online<span class="menu-bolinha novo" data-bolinha="pedidos" hidden></span></a>
      <a href="#/espera" data-rota="espera"><i data-icone="sino"></i>Lista de espera<span class="menu-bolinha" id="bolinha-espera" hidden></span></a>
      <a href="#/crediario" data-rota="crediario"><i data-icone="caderno"></i>Crediário<span class="menu-bolinha alerta" data-bolinha="crediario" hidden></span></a>
      <a href="#/clientes" data-rota="clientes"><i data-icone="clientes"></i>Clientes</a>
      <a href="#/caixa" data-rota="caixa"><i data-icone="carteira"></i>Caixa</a>
      <div class="menu-titulo" data-admin>Gestão</div>
      <a href="#/despesas" data-rota="despesas" data-admin><i data-icone="dinheiro"></i>Despesas</a>
      <a href="#/relatorios" data-rota="relatorios" data-admin><i data-icone="grafico"></i>Relatórios</a>
      <a href="#/historico" data-rota="historico" data-admin><i data-icone="relogio"></i>Histórico</a>
      <a href="#/usuarios" data-rota="usuarios" data-admin><i data-icone="chave"></i>Vendedores</a>
      <a href="#/config" data-rota="config" data-admin><i data-icone="ajustes"></i>Configurações</a>
    </nav>
    <div class="usuario-box" id="usuario-box"></div>
    <a class="status-caixa" id="status-caixa" href="#/caixa" title="Abrir / fechar o caixa"></a>
    <div class="menu-rodape">
      <button type="button" class="menu-recolher" id="menu-recolher"><i data-icone="recolher"></i><span>Recolher</span></button>
      <button type="button" class="menu-tema" id="tema" title="Modo escuro / claro"><i data-icone="lua"></i><span>Escuro</span></button>
    </div>
  </aside>
  <div class="menu-dica" id="menu-dica" hidden></div>

  <main id="conteudo"></main>

  <div id="modal-fundo" class="modal-fundo" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header><h2 id="modal-titulo"></h2><button class="fechar" data-fechar aria-label="Fechar"><i data-icone="fechar"></i></button></header>
      <div id="modal-corpo"></div>
    </div>
  </div>
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <iframe id="frame-impressao" title="impressão" tabindex="-1"></iframe>

  <script src="/js/icones.js"></script>
  <script>Icone.aplicar();</script>
  <script src="/js/barcode.js"></script>
  <script src="/js/qrcode.js"></script>

  <script src="/js/etiqueta-layout.js"></script>
  <script src="/js/impressao.js"></script>
  <script src="/js/grade-editor.js"></script>
  <script src="/js/trocas.js"></script>
  <script src="/js/telas/pdv.js"></script>
  <script src="/js/telas/produtos.js"></script>
  <script src="/js/telas/etiquetas.js"></script>
  <script src="/js/telas/editor-etiqueta.js"></script>
  <script src="/js/telas/vendas.js"></script>
  <script src="/js/telas/clientes.js"></script>
  <script src="/js/telas/caixa.js"></script>
  <script src="/js/telas/relatorios.js"></script>
  <script src="/js/telas/despesas.js"></script>
  <script src="/js/telas/config.js"></script>
  <script src="/js/telas/usuarios.js"></script>
  <script src="/js/telas/crediario.js"></script>
  <script src="/js/telas/inicio.js"></script>
  <script src="/js/telas/inventario.js"></script>
  <script src="/js/telas/condicional.js"></script>
  <script src="/js/telas/reservas.js"></script>
  <script src="/js/telas/espera.js"></script>
  <script src="/js/telas/pedidos.js"></script>
  <script src="/js/telas/historico.js"></script>
  <script src="/js/telas/boas-vindas.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
