<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#955968">
  <title>Foto do produto · Clara Styllus</title>
  <style>
    :root { --rosa: #955968; --rosa-escuro: #723f4c; --rosa-claro: #f3e6e9; --fundo: #f5f3f3; --texto: #292224; --suave: #7d6f76; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--fundo); color: var(--texto);
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; }
    .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .marca i { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, #a86979, #723f4c); color: #fff; display: grid; place-items: center; font: 600 17px Georgia, serif; font-style: normal; }
    .marca b { font: 600 20px Georgia, serif; }
    .cartao { width: 100%; max-width: 440px; background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(35,29,31,.08); text-align: center; }
    h1 { font-size: 15px; font-weight: 600; color: var(--suave); margin: 0; text-transform: uppercase; letter-spacing: 1.2px; }
    .produto { font-size: 22px; font-weight: 700; margin: 6px 0 16px; }
    .previa { width: 100%; aspect-ratio: 1; border-radius: 16px; background: var(--rosa-claro); display: grid; place-items: center; overflow: hidden; margin-bottom: 16px; color: #bd96a0; }
    .previa img { width: 100%; height: 100%; object-fit: cover; }
    .previa svg { width: 64px; height: 64px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 18px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
    .btn-primario { background: var(--rosa); color: #fff; box-shadow: 0 6px 16px rgba(149,89,104,.35); }
    .btn-claro { background: var(--rosa-claro); color: var(--rosa-escuro); margin-top: 10px; font-size: 16px; padding: 14px; }
    .btn[disabled] { opacity: .6; }
    .msg { margin-top: 14px; font-size: 15px; line-height: 1.4; }
    .ok { color: #1d7a4e; font-weight: 700; }
    .erro { color: #b3261e; font-weight: 600; }
    input[type=file] { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="marca"><i>CS</i><b>Clara Styllus</b></div>
  <div class="cartao">
    <h1 id="titulo">Foto do produto</h1>
    <div class="produto" id="nome">Carregando…</div>
    <div class="previa" id="previa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </div>
    <label class="btn btn-primario" id="tirar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="tirar-txt">Tirar foto</span>
      <input type="file" id="arquivo" accept="image/*" capture="environment">
    </label>
    <label class="btn btn-claro" id="galeria">Escolher da galeria<input type="file" id="arquivo-galeria" accept="image/*"></label>
    <div class="msg" id="msg">A foto aparece sozinha no cadastro, no computador da loja.</div>
  </div>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      var nome = document.getElementById('nome');
      var titulo = document.getElementById('titulo');
      var previa = document.getElementById('previa');
      var iconeCamera = previa.innerHTML;
      var botoes = [document.getElementById('tirar'), document.getElementById('galeria')];
      function aviso(t, classe) { msg.className = 'msg ' + (classe || ''); msg.textContent = t; }
      function mostrarBotoes(sim) { botoes.forEach(function (b) { b.hidden = !sim; }); }

      // Endereço: #s=<foto>&parear=<celular> (QR Code novo) ou #<foto> (QR Code antigo).
      var hash = (location.hash || '').replace('#', '');
      var params = {};
      hash.split('&').forEach(function (p) { var kv = p.split('='); if (kv[1]) params[kv[0]] = kv[1]; else if (kv[0]) params.s = kv[0]; });
      var guardado = null;
      try { guardado = localStorage.getItem('clara_celular'); } catch (e) { /* sem memória */ }
      if (/^[0-9a-f]{32}$/.test(params.parear || '')) {
        guardado = params.parear;
        try { localStorage.setItem('clara_celular', guardado); } catch (e) { /* sem memória */ }
      }
      var aparelho = /^[0-9a-f]{32}$/.test(guardado || '') ? guardado : null;
      var token = /^[0-9a-f]{32}$/.test(params.s || '') ? params.s : null;
      if (token || aparelho) history.replaceState(null, '', '/celular');

      /** Mostra a peça (ou a cliente) que vai receber a foto. */
      function usarPedido(p) {
        if (token === p.token) return;
        token = p.token;
        nome.textContent = p.nome;
        previa.innerHTML = iconeCamera;
        document.getElementById('tirar-txt').textContent = 'Tirar foto';
        titulo.textContent = p.tipo === 'cliente' ? 'Foto da cliente' : 'Foto do produto';
        document.title = (p.tipo === 'cliente' ? 'Foto da cliente' : 'Foto do produto') + ' · Clara Styllus';
        mostrarBotoes(true);
        aviso(p.tipo === 'cliente' ? 'A foto aparece sozinha no cadastro da cliente, no computador.' : 'A foto aparece sozinha no cadastro, no computador da loja.');
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      }
      /** Celular conectado, sem pedido: fica esperando o computador pedir uma foto. */
      var esperando = false;
      function esperar(nomeCelular) {
        esperando = true;
        token = null;
        titulo.textContent = 'Celular conectado ✓';
        nome.textContent = 'Esperando uma foto…';
        previa.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';
        mostrarBotoes(false);
        aviso('Deixe esta página aberta' + (nomeCelular ? ' (' + nomeCelular + ')' : '') + '. Quando for cadastrar uma peça no computador e clicar em "Celular", o nome dela aparece aqui para tirar a foto.', 'ok');
      }

      function perguntar() {
        if (!aparelho) return;
        fetch('/api/celular/aparelho/' + aparelho, { cache: 'no-store' })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
          .then(function (x) {
            if (x.status === 404) {
              aparelho = null;
              try { localStorage.removeItem('clara_celular'); } catch (e) { /* sem memória */ }
              if (!token) { nome.textContent = '—'; aviso('Este celular foi desconectado. Leia o QR Code de novo no computador.', 'erro'); }
              return;
            }
            if (x.j.pedido) { esperando = false; usarPedido(x.j.pedido); } else if (!esperando) esperar(x.j.nome);
          })
          .catch(function () { /* sem rede agora: tenta de novo */ })
          .then(function () { if (aparelho) setTimeout(perguntar, 1500); });
      }

      if (token) {
        fetch('/api/celular/sessao/' + token).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok) throw new Error(x.j.erro || 'Código vencido.');
            var t = token; token = null;
            usarPedido({ token: t, nome: x.j.nome, tipo: x.j.tipo });
          })
          .catch(function (e) {
            if (aparelho) return; // conectado: só espera o próximo pedido
            nome.textContent = '—'; aviso(e.message, 'erro'); mostrarBotoes(false);
          });
      } else if (!aparelho) {
        nome.textContent = '—';
        aviso('Código inválido. Leia o QR Code no computador.', 'erro');
        mostrarBotoes(false);
      } else {
        esperar('');
      }
      perguntar();

      /** Diminui a foto (no máximo 1200 px) para enviar rápido pelo Wi-Fi. */
      function reduzir(arquivo, lado, qualidade) {
        return new Promise(function (ok, falha) {
          var url = URL.createObjectURL(arquivo);
          var img = new Image();
          img.onload = function () {
            var f = Math.min(1, lado / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * f);
            c.height = Math.round(img.height * f);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            ok(c.toDataURL('image/jpeg', qualidade));
          };
          img.onerror = function () { falha(new Error('Não consegui abrir a foto.')); };
          img.src = url;
        });
      }

      function enviar(ev) {
        var arq = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!arq || !token) return;
        var alvo = token;
        var botao = document.getElementById('tirar');
        botao.setAttribute('disabled', '');
        aviso('Enviando a foto…');
        reduzir(arq, 1200, 0.82)
          .then(function (dados) { return dados.length > 2e6 ? reduzir(arq, 900, 0.7) : dados; })
          .then(function (dados) {
            previa.innerHTML = '<img alt="" src="' + dados + '">';
            return fetch('/api/celular/foto/' + alvo, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imagem: dados }),
            });
          })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Não foi possível enviar.'); }); })
          .then(function () {
            aviso('✓ Foto enviada! Ela já aparece no computador. Se não gostou, tire outra.', 'ok');
            document.getElementById('tirar-txt').textContent = 'Tirar outra foto';
          })
          .catch(function (e) { aviso(e.message, 'erro'); })
          .then(function () { botao.removeAttribute('disabled'); });
      }
      document.getElementById('arquivo').addEventListener('change', enviar);
      document.getElementById('arquivo-galeria').addEventListener('change', enviar);
    })();
  </script>
</body>
</html>
