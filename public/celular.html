<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a14d6f">
  <title>Foto do produto · Clara Styllus</title>
  <style>
    :root { --rosa: #a14d6f; --rosa-escuro: #7c3554; --rosa-claro: #f6e3ec; --fundo: #f6f2f4; --texto: #2b2027; --suave: #7d6f76; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--fundo); color: var(--texto);
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; }
    .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .marca i { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(140deg, #b45d81, #7c3554); color: #fff; display: grid; place-items: center; font: 600 17px Georgia, serif; font-style: normal; }
    .marca b { font: 600 20px Georgia, serif; }
    .cartao { width: 100%; max-width: 440px; background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(36,28,32,.08); text-align: center; }
    h1 { font-size: 15px; font-weight: 600; color: var(--suave); margin: 0; text-transform: uppercase; letter-spacing: 1.2px; }
    .produto { font-size: 22px; font-weight: 700; margin: 6px 0 16px; }
    .previa { width: 100%; aspect-ratio: 1; border-radius: 16px; background: var(--rosa-claro); display: grid; place-items: center; overflow: hidden; margin-bottom: 16px; color: #c58ea6; }
    .previa img { width: 100%; height: 100%; object-fit: cover; }
    .previa svg { width: 64px; height: 64px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 18px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
    .btn-primario { background: var(--rosa); color: #fff; box-shadow: 0 6px 16px rgba(161,77,111,.35); }
    .btn-claro { background: var(--rosa-claro); color: var(--rosa-escuro); margin-top: 10px; font-size: 16px; padding: 14px; }
    .btn[disabled] { opacity: .6; }
    .msg { margin-top: 14px; font-size: 15px; line-height: 1.4; }
    .ok { color: #1d7a4e; font-weight: 700; }
    .erro { color: #b3261e; font-weight: 600; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="marca"><i>CS</i><b>Clara Styllus</b></div>
  <div class="cartao">
    <h1>Foto do produto</h1>
    <div class="produto" id="nome">Carregando…</div>
    <div class="previa" id="previa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </div>
    <label class="btn btn-primario" id="tirar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span id="tirar-txt">Tirar foto</span>
      <input type="file" id="arquivo" accept="image/*" capture="environment">
    </label>
    <label class="btn btn-claro" id="galeria">Escolher da galeria<input type="file" id="arquivo-galeria" accept="image/*"></label>
    <div class="msg" id="msg">A foto aparece sozinha no cadastro, no computador da loja.</div>
  </div>
  <script>
    (function () {
      var token = (location.hash || '').replace('#', '');
      var msg = document.getElementById('msg');
      var nome = document.getElementById('nome');
      function aviso(t, classe) { msg.className = 'msg ' + (classe || ''); msg.textContent = t; }

      if (!/^[0-9a-f]{32}$/.test(token)) {
        nome.textContent = '—';
        aviso('Código inválido. Gere um QR Code novo no computador.', 'erro');
        return;
      }
      fetch('/api/celular/sessao/' + token).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) throw new Error(x.j.erro || 'Código vencido.');
          nome.textContent = x.j.nome;
        })
        .catch(function (e) { nome.textContent = '—'; aviso(e.message, 'erro'); document.getElementById('tirar').hidden = true; document.getElementById('galeria').hidden = true; });

      /** Diminui a foto (no máximo 1200 px) para enviar rápido pelo Wi-Fi. */
      function reduzir(arquivo, lado, qualidade) {
        return new Promise(function (ok, falha) {
          var url = URL.createObjectURL(arquivo);
          var img = new Image();
          img.onload = function () {
            var f = Math.min(1, lado / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * f);
            c.height = Math.round(img.height * f);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            ok(c.toDataURL('image/jpeg', qualidade));
          };
          img.onerror = function () { falha(new Error('Não consegui abrir a foto.')); };
          img.src = url;
        });
      }

      function enviar(ev) {
        var arq = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!arq) return;
        var botao = document.getElementById('tirar');
        botao.setAttribute('disabled', '');
        aviso('Enviando a foto…');
        reduzir(arq, 1200, 0.82)
          .then(function (dados) { return dados.length > 2e6 ? reduzir(arq, 900, 0.7) : dados; })
          .then(function (dados) {
            document.getElementById('previa').innerHTML = '<img alt="" src="' + dados + '">';
            return fetch('/api/celular/foto/' + token, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imagem: dados }),
            });
          })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Não foi possível enviar.'); }); })
          .then(function () {
            aviso('✓ Foto enviada! Ela já aparece no computador. Se não gostou, tire outra.', 'ok');
            document.getElementById('tirar-txt').textContent = 'Tirar outra foto';
          })
          .catch(function (e) { aviso(e.message, 'erro'); })
          .then(function () { botao.removeAttribute('disabled'); });
      }
      document.getElementById('arquivo').addEventListener('change', enviar);
      document.getElementById('arquivo-galeria').addEventListener('change', enviar);
    })();
  </script>
</body>
</html>
