<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITULO__</title>
<meta name="description" content="__DESCRICAO__">
<meta property="og:title" content="__TITULO__">
<meta property="og:description" content="__DESCRICAO__">
<meta property="og:image" content="__OG_IMAGEM__">
<meta name="theme-color" content="#2b1d22">
<link rel="icon" href="assets/icone.png">
<style>
@font-face { font-family: 'Inter'; src: url('assets/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Playfair Display'; src: url('assets/playfair-display.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
:root {
  --vinho: #2b1d22; --vinho-2: #4a2e36; --rosa: #955968; --rosa-escuro: #703d4a; --rosa-claro: #f7eef0;
  --ouro: #d4a24a; --ouro-claro: #f3d48a; --creme: #fbf7f4; --texto: #241c1f; --suave: #7a6d74; --borda: #ece3e6;
  --serif: 'Playfair Display', Georgia, serif; --sans: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; overflow-x: clip; }
/* A faixa inclinada e a sacola escondida passam da largura da tela: corta sem criar rolagem para o lado. */
body { margin: 0; font-family: var(--sans); color: var(--texto); background: var(--creme); overflow-x: hidden; overflow-x: clip; max-width: 100%; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

/* Abertura */
#abertura { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(60% 50% at 50% 45%, rgba(212,162,74,.25), transparent 70%), var(--vinho);
  transition: opacity .7s ease, visibility .7s; }
#abertura.fora { opacity: 0; visibility: hidden; }
#abertura img { width: min(300px, 64vw); animation: logo-entra 1.1s cubic-bezier(.2,.8,.2,1) both; filter: drop-shadow(0 10px 30px rgba(0,0,0,.4)); }
#abertura i { position: absolute; bottom: 22%; width: 140px; height: 2px; background: rgba(255,255,255,.12); overflow: hidden; border-radius: 2px; }
#abertura i::after { content: ''; position: absolute; inset: 0; background: var(--ouro); transform: scaleX(0); transform-origin: left; animation: carga 1.1s .2s ease forwards; }
@keyframes logo-entra { from { opacity: 0; transform: scale(.9) translateY(12px); filter: blur(8px); } }
@keyframes carga { to { transform: scaleX(1); } }

/* Poeira dourada */
#poeira { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* Topo */
.topo { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 12px clamp(16px, 4vw, 48px);
  transition: background .3s, box-shadow .3s, padding .3s; }
.topo.solido { background: rgba(43,29,34,.86); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 10px 30px rgba(0,0,0,.18); padding-top: 8px; padding-bottom: 8px; }
.topo-logo { height: 42px; width: auto; }
.topo .espaco { flex: 1; }
.bt-zap { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: #25d366; color: #fff; font-weight: 700; font-size: 14px;
  padding: 10px 16px; text-decoration: none; box-shadow: 0 8px 20px -8px rgba(37,211,102,.8); transition: transform .2s; }
.bt-zap:hover { transform: translateY(-2px); }
.bt-zap svg { width: 18px; height: 18px; }
.bt-sacola { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; display: grid; place-items: center; }
.bt-sacola svg { width: 21px; height: 21px; }
.bt-sacola b { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--ouro); color: var(--vinho); font-size: 11.5px; display: grid; place-items: center; padding: 0 5px; }
.bt-sacola.pula { animation: pula .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes pula { 40% { transform: scale(1.25); } }

/* Abertura da página (hero) */
.hero { position: relative; z-index: 1; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: 20px;
  padding: 110px clamp(16px, 5vw, 72px) 60px; color: #fff; overflow: hidden;
  background: radial-gradient(70% 60% at 75% 50%, rgba(149,89,104,.55), transparent 70%), radial-gradient(50% 50% at 10% 90%, rgba(212,162,74,.18), transparent 70%), linear-gradient(160deg, #3b2730, var(--vinho) 60%, #1d1316); }
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 120px; background: linear-gradient(transparent, var(--creme)); pointer-events: none; }
.hero-txt { position: relative; z-index: 2; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--ouro-claro); }
.kicker::before { content: ''; width: 34px; height: 1.5px; background: var(--ouro); }
.hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(44px, 7vw, 96px); line-height: .98; margin: 18px 0 18px; letter-spacing: -1px; }
.hero h1 em { font-style: italic; color: var(--ouro-claro); }
.hero p { font-size: clamp(16px, 1.6vw, 19px); color: rgba(255,255,255,.78); max-width: 480px; line-height: 1.55; margin: 0 0 28px; }
.hero-acoes { display: flex; gap: 12px; flex-wrap: wrap; }
.bt-ouro { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 15px 26px; font-weight: 700; font-size: 15.5px; text-decoration: none;
  background: linear-gradient(135deg, var(--ouro-claro), var(--ouro)); color: var(--vinho); box-shadow: 0 14px 30px -12px rgba(212,162,74,.8); transition: transform .2s, box-shadow .2s; }
.bt-ouro:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -12px rgba(212,162,74,.9); }
.bt-vidro { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 14px 24px; font-weight: 600; font-size: 15px; text-decoration: none;
  border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; backdrop-filter: blur(8px); }
.hero-nums { display: flex; gap: 28px; margin-top: 38px; }
.hero-nums b { display: block; font-family: var(--serif); font-size: 34px; color: #fff; }
.hero-nums span { font-size: 12.5px; color: rgba(255,255,255,.6); letter-spacing: .5px; }

/* Carrossel 3D */
.palco { position: relative; z-index: 1; height: min(620px, 72vh); perspective: 1500px; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.palco:active { cursor: grabbing; }
.anel { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
.anel figure { position: absolute; margin: 0; width: var(--w); height: calc(var(--w) * 1.33); left: calc(var(--w) / -2); top: calc(var(--w) * -.665);
  border-radius: 22px; overflow: hidden; background: #3a2a30; box-shadow: 0 30px 60px -20px rgba(0,0,0,.65); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid rgba(255,255,255,.14); }
.anel figure img { width: 100%; height: 100%; object-fit: cover; }
.anel figure figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 14px 12px; background: linear-gradient(transparent, rgba(20,12,15,.85)); font-size: 13px; font-weight: 600; }
.anel figure figcaption b { display: block; color: var(--ouro-claro); font-size: 15px; }
.chao { position: absolute; left: 50%; bottom: 4%; width: 70%; height: 60px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.45), transparent); filter: blur(6px); }
.palco-dica { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); font-size: 12px; color: rgba(255,255,255,.55); letter-spacing: 1px; white-space: nowrap; }

/* Faixa corrida */
.faixa { position: relative; z-index: 2; overflow: hidden; background: var(--vinho); color: var(--ouro-claro); padding: 14px 0; transform: rotate(-1.2deg); margin: -10px -10px 0; box-shadow: 0 10px 30px rgba(43,29,34,.2); }
.faixa div { display: flex; gap: 44px; width: max-content; animation: corre 32s linear infinite; font-family: var(--serif); font-size: 20px; font-style: italic; }
.faixa span::after { content: '✦'; margin-left: 44px; font-style: normal; color: var(--ouro); }
@keyframes corre { to { transform: translateX(-50%); } }

/* Vitrine */
main { position: relative; z-index: 2; background: var(--creme); }
.secao { padding: 70px clamp(16px, 5vw, 72px) 40px; max-width: 1400px; margin: 0 auto; }
.secao-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.secao-cab h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(32px, 4vw, 52px); margin: 6px 0 0; line-height: 1; }
.secao-cab .kicker { color: var(--rosa); }
.secao-cab .kicker::before { background: var(--rosa); }
.busca { position: relative; flex: 0 1 340px; }
.busca input { width: 100%; font: inherit; font-size: 15px; padding: 14px 18px 14px 46px; border-radius: 999px; border: 1px solid var(--borda); background: #fff; outline: none; box-shadow: 0 6px 20px -12px rgba(77,49,57,.3); }
.busca input:focus { border-color: var(--rosa); box-shadow: 0 0 0 4px rgba(149,89,104,.14); }
.busca svg { position: absolute; left: 17px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--suave); }
.cats { position: sticky; top: 66px; z-index: 30; display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px; margin: 0 -2px 18px; scrollbar-width: none; background: linear-gradient(var(--creme) 70%, transparent); }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex-shrink: 0; border: 1px solid var(--borda); background: #fff; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--texto); transition: all .2s; }
.cats button small { color: var(--suave); font-weight: 600; margin-left: 4px; }
.cats button.sel { background: var(--vinho); color: #fff; border-color: var(--vinho); box-shadow: 0 8px 18px -8px rgba(43,29,34,.6); }
.cats button.sel small { color: var(--ouro-claro); }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: clamp(12px, 2vw, 26px); }

/* Cartão com inclinação 3D */
.peca { position: relative; border-radius: 24px; background: #fff; transform-style: preserve-3d; transition: transform .25s ease, box-shadow .25s ease; box-shadow: 0 12px 30px -18px rgba(77,49,57,.45);
  opacity: 0; transform: perspective(900px) translateY(40px) rotateX(18deg); will-change: transform; }
.peca.visivel { opacity: 1; transform: none; transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1), box-shadow .25s; transition-delay: var(--atraso, 0s); }
.peca.visivel.mexendo { transition: transform .08s linear, box-shadow .25s; }
.peca:hover { box-shadow: 0 30px 50px -22px rgba(77,49,57,.55); }
.peca-foto { position: relative; aspect-ratio: 3 / 4; border-radius: 24px 24px 0 0; overflow: hidden; background: var(--rosa-claro); }
.peca-foto img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.peca:hover .peca-foto img { transform: scale(1.06); }
.peca-foto .sem { width: 100%; height: 100%; display: grid; place-items: center; color: #c6a2ab; font-family: var(--serif); font-size: 20px; }
.brilho { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(circle at var(--bx, 50%) var(--by, 0%), rgba(255,255,255,.45), transparent 50%); opacity: 0; transition: opacity .3s; mix-blend-mode: soft-light; }
.peca:hover .brilho { opacity: 1; }
.num { position: absolute; left: 12px; bottom: 12px; font-family: var(--serif); font-size: 15px; font-weight: 700; background: rgba(255,255,255,.92); color: var(--vinho); border-radius: 999px; padding: 4px 11px; }
.selos { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.selo { font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.selo.novo { background: #fff; color: var(--rosa-escuro); }
.selo.desc { background: #c2372b; color: #fff; }
.selo.ultima { background: var(--ouro); color: var(--vinho); }
.selo.top { background: var(--vinho); color: var(--ouro-claro); }
.peca-txt { padding: 14px 64px 16px 16px; }
.peca-cat { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ouro); }
.peca-txt h3 { margin: 4px 0 8px; font-size: 16px; font-weight: 650; line-height: 1.3; }
.tams { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.tams i { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #f4eef0; }
.preco { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.preco s { color: var(--suave); font-size: 13px; }
.preco b { font-size: 20px; font-weight: 800; color: var(--rosa-escuro); }
.preco small { width: 100%; font-size: 12px; color: var(--suave); }
.preco .pix { width: 100%; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #138a5e; }
.preco .pix svg { width: 14px; height: 14px; flex: none; }
.preco .pix em { font-style: normal; font-weight: 600; color: var(--suave); white-space: nowrap; }
@media (max-width: 560px) { .preco .pix { font-size: 12px; gap: 4px; } .preco .pix svg { width: 12px; height: 12px; } .grade .pix-din { display: none; } }
/* Formas de pagamento (peça e sacola) */
.pagamentos { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 2px; }
.pagamentos span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; background: #fff; border: 1.5px solid var(--borda); font-size: 12.5px; font-weight: 700; color: var(--texto); }
.pagamentos svg { width: 16px; height: 16px; flex: none; }
.pagamentos .pg-pix { color: #138a5e; border-color: rgba(50,188,173,.45); background: #effaf6; }
.pagamentos .pg-pix svg { color: #32bcad; }
.pagamentos .pg-din svg { color: #2f8f4e; }
.pagamentos .pg-cartao svg { color: var(--rosa); }
.gaveta-pix { display: flex; justify-content: space-between; align-items: center; margin-top: -6px; font-size: 13.5px; font-weight: 700; color: #138a5e; }
.gaveta-pix b { font-size: 16px; }
/* Cartão "Formas de pagamento" com o valor em cada forma */
.pg-cartao-box { background: #fff; border: 1px solid var(--borda); border-radius: 18px; padding: 6px 14px; box-shadow: 0 14px 30px -24px rgba(43,29,34,.5); }
.pg-cartao-box h5 { margin: 8px 0 2px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--suave); }
.pg-linha { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--borda); }
.pg-cartao-box h5 + .pg-linha { border-top: 0; }
.pg-linha i { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--rosa-claro); color: var(--rosa-escuro); }
.pg-linha i svg { width: 18px; height: 18px; }
.pg-linha.pix i { background: #e8f8f3; color: #1d9b83; }
.pg-linha.din i { background: #edf7ef; color: #2f8f4e; }
.pg-linha span { font-size: 13.5px; font-weight: 700; line-height: 1.2; }
.pg-linha span small { display: block; font-weight: 500; font-size: 11.5px; color: var(--suave); }
.pg-linha b { font-size: 15px; white-space: nowrap; }
.pg-linha.pix b, .pg-linha.din b { color: #138a5e; }
.pg-linha em { font-style: normal; font-size: 10.5px; font-weight: 800; color: #fff; background: #1d9b83; border-radius: 999px; padding: 2px 7px; margin-left: 4px; vertical-align: 2px; }
/* Faixa de benefícios */
.beneficios { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 1180px; margin: 34px auto 0; padding: 0 22px; }
.beneficio { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 20px; background: #fff; border: 1px solid var(--borda); box-shadow: 0 12px 30px -22px rgba(43,29,34,.45); }
.beneficio i { width: 42px; height: 42px; flex: none; border-radius: 14px; display: grid; place-items: center; background: var(--rosa-claro); color: var(--rosa-escuro); }
.beneficio i svg { width: 22px; height: 22px; }
.beneficio.pix i { background: #e8f8f3; color: #1d9b83; }
.beneficio b { display: block; font-size: 14.5px; color: var(--texto); }
.beneficio small { display: block; font-size: 12.5px; color: var(--suave); line-height: 1.35; }
@media (max-width: 860px) { .beneficios { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 26px; padding: 0 14px; } .beneficio { padding: 12px; gap: 10px; border-radius: 16px; } .beneficio i { width: 36px; height: 36px; border-radius: 12px; } .beneficio b { font-size: 13px; } .beneficio small { font-size: 11.5px; } }
.bt-add { position: absolute; right: 12px; bottom: 12px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--vinho); color: #fff; display: grid; place-items: center;
  box-shadow: 0 10px 20px -8px rgba(43,29,34,.7); transition: transform .2s, background .2s; }
.bt-add:hover { background: var(--rosa); transform: scale(1.08); }
.bt-add svg { width: 20px; height: 20px; }
.nada { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--suave); font-size: 16px; }

/* Provador (detalhe da peça) */
.cortina { position: fixed; inset: 0; z-index: 60; background: rgba(20,12,15,.65); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; opacity: 0; transition: opacity .3s; }
.cortina.aberta { opacity: 1; }
.provador { position: relative; width: min(980px, 100%); max-height: calc(100svh - 32px); overflow: auto; background: var(--creme); border-radius: 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  transform: perspective(1400px) rotateY(-14deg) scale(.92); transition: transform .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 40px 80px -20px rgba(0,0,0,.6); }
.cortina.aberta .provador { transform: none; }
.prov-fotos { position: relative; background: var(--rosa-claro); perspective: 1200px; min-height: 360px; overflow: hidden; }
.prov-face .peca-foto { aspect-ratio: auto; height: 100%; border-radius: 0; }
.prov-cartao { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.prov-cartao.virado { transform: rotateY(180deg); }
.prov-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.prov-face img { width: 100%; height: 100%; object-fit: cover; }
.prov-face.verso { transform: rotateY(180deg); }
.prov-mini { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 2; }
.prov-mini button { width: 52px; height: 66px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.8); padding: 0; background: #fff; opacity: .75; }
.prov-mini button.sel { border-color: var(--ouro); opacity: 1; }
.prov-mini img { width: 100%; height: 100%; object-fit: cover; }
.prov-txt { padding: 34px 30px 28px; display: flex; flex-direction: column; gap: 14px; }
.prov-txt h2 { font-family: var(--serif); font-weight: 600; font-size: 34px; margin: 0; line-height: 1.05; }
.prov-txt .preco b { font-size: 30px; }
.prov-txt h4 { margin: 4px 0 0; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--suave); }
.escolha { display: flex; flex-wrap: wrap; gap: 8px; }
.escolha button { min-width: 52px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--borda); background: #fff; font-weight: 700; transition: all .15s; }
.escolha button.sel { border-color: var(--vinho); background: var(--vinho); color: #fff; transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(43,29,34,.6); }
.prov-acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.prov-acoes .bt-ouro { flex: 1; justify-content: center; }
.prov-acoes svg { width: 18px; height: 18px; flex-shrink: 0; }
.bt-linha { display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1; border-radius: 999px; padding: 14px 20px; font-weight: 700; border: 1.5px solid var(--vinho); background: transparent; color: var(--vinho); }
.fechar { position: absolute; right: 14px; top: 14px; z-index: 3; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.fechar svg { width: 18px; height: 18px; }
.aviso-escolha { color: #b3372c; font-size: 13px; font-weight: 600; }
.prov-txt .preco .pix, .prov-txt .preco small { display: none; }
.prov-txt .preco-pix-g { display: flex; align-items: center; gap: 6px; margin-top: -6px; font-size: 14.5px; font-weight: 800; color: #138a5e; }
.prov-txt .preco-pix-g svg { width: 16px; height: 16px; }
.prov-txt .preco-pix-g em { font-style: normal; font-weight: 600; color: var(--suave); }
.h4-tam b { color: var(--vinho); letter-spacing: 0; text-transform: none; font-size: 13px; margin: 0 auto 0 -4px; }
#esc-tam button { min-width: 50px; height: 50px; padding: 0 12px; border-radius: 16px; font-size: 15px; }
.prov-acoes { position: sticky; bottom: 0; z-index: 4; margin: 6px -30px -28px; padding: 14px 30px 18px; background: var(--creme); box-shadow: 0 -14px 24px -16px rgba(43,29,34,.35); border-top: 1px solid var(--borda); }
.prov-acoes { flex-wrap: nowrap !important; align-items: center; }
.prov-acoes .bt-fav-g, .prov-acoes .bt-sacola-g { flex: 0 0 52px !important; width: 52px; height: 52px; border-radius: 16px; }
.bt-sacola-g { position: relative; display: grid; place-items: center; padding: 0; border: 1.5px solid var(--borda); background: #fff; color: var(--vinho); transition: transform .15s, border-color .15s; }
.bt-sacola-g:hover { border-color: var(--vinho); transform: translateY(-1px); }
.bt-sacola-g svg { width: 22px !important; height: 22px !important; }
.bt-sacola-g b { position: absolute; right: 7px; bottom: 6px; width: 17px; height: 17px; border-radius: 50%; background: var(--vinho); color: #fff; font-size: 13px; line-height: 17px; text-align: center; }
.prov-acoes .bt-fav-g { border-radius: 16px; }
.prov-acoes .bt-reservar { flex: 1 1 auto !important; order: 0 !important; height: 52px; padding: 0 18px; border-radius: 16px; justify-content: center; gap: 9px; font-size: 15.5px; white-space: nowrap;
  background: var(--vinho); color: #fff; box-shadow: 0 14px 28px -14px rgba(43,29,34,.8); }
.prov-acoes .bt-reservar:hover { box-shadow: 0 18px 32px -14px rgba(43,29,34,.9); }
.prov-acoes .bt-reservar svg { width: 19px; height: 19px; color: var(--ouro-claro); }
.prov-retira { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--suave); margin-top: -2px; }
.prov-retira svg { width: 14px; height: 14px; }
@media (max-width: 860px) {
  .cortina { padding: 0; place-items: end center; }
  .provador { width: 100%; max-height: 94svh; border-radius: 26px 26px 0 0; transform: translateY(60px); box-shadow: 0 -20px 60px -20px rgba(0,0,0,.5); }
  .prov-fotos { aspect-ratio: 4 / 5 !important; max-height: 62svh; width: 100%; }
  .prov-txt { padding: 20px 18px 0; gap: 12px; }
  .prov-txt h2 { font-size: 28px; }
  .prov-acoes { margin: 4px -18px 0; padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); }
}

/* Sacola */
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(420px, 100%); background: var(--creme); box-shadow: -30px 0 60px rgba(0,0,0,.25); display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
.gaveta.aberta { transform: none; }
.gaveta-cab { display: flex; align-items: center; justify-content: space-between; padding: 22px 22px 12px; }
.gaveta-cab h3 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 0; }
.gaveta-cab .fechar { position: static; }
.gaveta-lista { flex: 1; overflow: auto; padding: 4px 22px; display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 8px; box-shadow: 0 6px 16px -12px rgba(77,49,57,.4); animation: entra-item .4s cubic-bezier(.2,.8,.2,1); }
@keyframes entra-item { from { opacity: 0; transform: translateX(30px); } }
.item img, .item .sem { width: 64px; height: 80px; border-radius: 12px; object-fit: cover; background: var(--rosa-claro); }
.item b { font-size: 14px; display: block; }
.item small { color: var(--suave); font-size: 12.5px; }
.item button { border: 0; background: none; color: var(--suave); padding: 8px; }
.gaveta-pe { padding: 18px 22px calc(22px + env(safe-area-inset-bottom)); border-top: 1px solid var(--borda); display: flex; flex-direction: column; gap: 12px; }
.gaveta-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.gaveta-total b { font-size: 24px; color: var(--rosa-escuro); }
.gaveta-pe .bt-zap { justify-content: center; padding: 16px; font-size: 16px; }
.gaveta-vazia { text-align: center; color: var(--suave); padding: 50px 10px; }

/* Finalizar pedido */
.form-pedido { display: flex; flex-direction: column; gap: 10px; }
.form-pedido label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; color: var(--suave); }
.form-pedido input, .form-pedido textarea { font: inherit; font-size: 16px; font-weight: 500; color: var(--texto); padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--borda); background: #fff; outline: none; resize: none; }
.form-pedido input:focus, .form-pedido textarea:focus { border-color: var(--rosa); box-shadow: 0 0 0 4px rgba(149,89,104,.14); }
.form-pedido .erro { color: #b3372c; font-size: 13px; font-weight: 600; }
.foto-cliente { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 16px; border: 1.5px dashed var(--borda); background: #fff; }
.form-pedido label.foto-cliente-bola { flex: none; width: 66px; height: 66px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--rosa-claro); color: var(--rosa-escuro); cursor: pointer; }
.foto-cliente-bola svg { width: 28px; height: 28px; }
.foto-cliente-bola img { width: 100%; height: 100%; object-fit: cover; }
.foto-cliente b { display: block; font-size: 14px; color: var(--texto); }
.foto-cliente b small { font-weight: 500; color: var(--suave); }
.foto-cliente span { display: block; font-size: 12px; color: var(--suave); margin: 2px 0 6px; }
.form-pedido label.foto-cliente-bt, .foto-cliente-tirar { display: inline-block; font-size: 13px; font-weight: 700; color: var(--vinho); text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 0; }
.foto-cliente-tirar { color: var(--suave); margin-left: 10px; }
.form-pedido label.consente { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 500; font-size: 12.5px; line-height: 1.4; }
.form-pedido label.consente input { width: 20px; height: 20px; padding: 0; margin: 1px 0 0; flex: none; accent-color: var(--vinho); }
.bt-pedido { display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; padding: 16px; font-weight: 800; font-size: 16px; color: var(--vinho);
  background: linear-gradient(135deg, var(--ouro-claro), var(--ouro)); box-shadow: 0 14px 30px -12px rgba(212,162,74,.8); }
.bt-pedido[disabled] { opacity: .6; }
.bt-voltar { border: 0; background: none; color: var(--suave); font-weight: 600; padding: 6px; }
.feito { text-align: center; padding: 26px 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.feito .ok { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(140deg, #37b37a, #1f7a50); color: #fff; box-shadow: 0 16px 30px -12px rgba(31,122,80,.8);
  animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
.feito .ok svg { width: 40px; height: 40px; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.feito h4 { font-family: var(--serif); font-size: 26px; margin: 4px 0 0; font-weight: 600; }
.feito .cod { font-family: var(--serif); font-size: 22px; color: var(--rosa-escuro); background: #fff; border: 1.5px dashed var(--ouro); border-radius: 14px; padding: 8px 18px; letter-spacing: 2px; }
.feito p { margin: 0; color: var(--suave); line-height: 1.5; }

/* Rodapé */
.rodape { position: relative; z-index: 2; background: var(--vinho); color: rgba(255,255,255,.75); padding: 60px clamp(16px, 5vw, 72px) 40px; text-align: center; }
.rodape img { height: 70px; margin: 0 auto 18px; }
.rodape p { margin: 6px 0; font-size: 14.5px; }
.rodape a { color: var(--ouro-claro); text-decoration: none; font-weight: 600; }
.rodape small { display: block; margin-top: 24px; color: rgba(255,255,255,.4); font-size: 12px; }
.zap-flutuante { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 45; width: 60px; height: 60px; border-radius: 50%; background: #25d366; color: #fff; display: grid; place-items: center;
  box-shadow: 0 14px 30px -10px rgba(37,211,102,.9); animation: respira 2.6s ease-in-out infinite; }
.zap-flutuante svg { width: 30px; height: 30px; }
@keyframes respira { 50% { transform: scale(1.07); } }
.toast { position: fixed; left: 50%; bottom: 96px; z-index: 65; transform: translate(-50%, 30px); opacity: 0; background: var(--vinho); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px;
  transition: all .35s cubic-bezier(.2,.8,.2,1); pointer-events: none; box-shadow: 0 14px 30px -10px rgba(0,0,0,.5); }
.toast.ver { opacity: 1; transform: translate(-50%, 0); }

/* Foto de capa (escolhida no sistema) */
.hero.com-capa { background: linear-gradient(100deg, rgba(20,12,15,.9) 0%, rgba(20,12,15,.62) 45%, rgba(20,12,15,.25) 100%), var(--capa) center / cover no-repeat; }
.hero.com-capa::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 60% at 80% 40%, var(--brilho-tema, transparent), transparent 70%); pointer-events: none; }
.hero-marca { position: absolute; z-index: 0; right: -2vw; bottom: 8%; font-family: var(--sans); font-weight: 900; font-size: clamp(90px, 19vw, 300px); line-height: .8; letter-spacing: -6px;
  color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.09); pointer-events: none; white-space: nowrap; user-select: none; }

/* Contagem regressiva das datas especiais */
.contagem { display: inline-flex; flex-direction: column; gap: 8px; margin: 0 0 26px; }
.contagem small { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ouro-claro); }
.contagem div { display: flex; gap: 8px; }
.contagem span { min-width: 62px; padding: 8px 6px 6px; border-radius: 14px; text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(8px); }
.contagem b { display: block; font-family: var(--serif); font-size: 28px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
.contagem i { font-style: normal; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.6); }

/* Temas de época */
body[data-tema=black_friday] { --vinho: #0e0c0d; --vinho-2: #231d1f; --rosa: #d1342b; --rosa-escuro: #c2281f; --rosa-claro: #f4efe9; --ouro: #ffcc00; --ouro-claro: #ffe266; --creme: #f7f4f1; --brilho-tema: rgba(255,204,0,.18); }
body[data-tema=black_friday] .hero { background: radial-gradient(60% 55% at 78% 48%, rgba(255,204,0,.16), transparent 70%), radial-gradient(45% 45% at 8% 95%, rgba(209,52,43,.25), transparent 70%), linear-gradient(160deg, #1c1718, #0b0a0a 60%, #000); }
body[data-tema=black_friday] .hero.com-capa { background: linear-gradient(100deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.66) 45%, rgba(0,0,0,.3) 100%), var(--capa) center / cover no-repeat; }
body[data-tema=black_friday] .hero-marca { -webkit-text-stroke-color: rgba(255,204,0,.14); }
body[data-tema=black_friday] .selo.desc { background: var(--ouro); color: #000; font-size: 12.5px; padding: 6px 11px; }
body[data-tema=black_friday] .faixa { background: #000; color: var(--ouro); }
body[data-tema=black_friday] .faixa div { font-family: var(--sans); font-style: normal; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 17px; }
body[data-tema=black_friday] .bt-ouro, body[data-tema=black_friday] .bt-pedido { color: #000; }
body[data-tema=black_friday] .contagem span { background: rgba(255,204,0,.08); border-color: rgba(255,204,0,.35); }

body[data-tema=natal] { --vinho: #123524; --vinho-2: #1d4a33; --rosa: #b3262e; --rosa-escuro: #9b1d25; --rosa-claro: #f6efe9; --ouro: #d9a441; --ouro-claro: #f2d38a; --creme: #fbf8f3; --brilho-tema: rgba(217,164,65,.2); }
body[data-tema=natal] .hero { background: radial-gradient(60% 55% at 78% 48%, rgba(179,38,46,.45), transparent 70%), radial-gradient(45% 45% at 8% 95%, rgba(217,164,65,.2), transparent 70%), linear-gradient(160deg, #1b4a33, #123524 60%, #0a2116); }
body[data-tema=natal] .hero.com-capa { background: linear-gradient(100deg, rgba(10,33,22,.9) 0%, rgba(10,33,22,.6) 45%, rgba(10,33,22,.25) 100%), var(--capa) center / cover no-repeat; }
body[data-tema=natal] .faixa { background: var(--rosa); color: #fff; }
body[data-tema=natal] .faixa span::after { color: var(--ouro-claro); }

body[data-tema=maes] { --vinho: #5a2140; --vinho-2: #7a3157; --rosa: #d0688f; --rosa-escuro: #b24c74; --rosa-claro: #fdf0f4; --ouro: #e2a8b9; --ouro-claro: #ffd9e4; --creme: #fffafb; --brilho-tema: rgba(255,217,228,.2); }
body[data-tema=maes] .hero { background: radial-gradient(60% 55% at 78% 48%, rgba(208,104,143,.55), transparent 70%), radial-gradient(45% 45% at 8% 95%, rgba(255,217,228,.25), transparent 70%), linear-gradient(160deg, #7a3157, #5a2140 60%, #3b1229); }
body[data-tema=maes] .hero.com-capa { background: linear-gradient(100deg, rgba(59,18,41,.88) 0%, rgba(59,18,41,.58) 45%, rgba(59,18,41,.2) 100%), var(--capa) center / cover no-repeat; }
body[data-tema=maes] .bt-ouro, body[data-tema=maes] .bt-pedido { background: linear-gradient(135deg, #fff, var(--ouro-claro)); }

body[data-tema=namorados] { --vinho: #4a0f1c; --vinho-2: #6b1628; --rosa: #d23a54; --rosa-escuro: #b42740; --rosa-claro: #fdf0f2; --ouro: #f08ba0; --ouro-claro: #ffc6d2; --creme: #fffafa; --brilho-tema: rgba(240,139,160,.22); }
body[data-tema=namorados] .hero { background: radial-gradient(60% 55% at 78% 48%, rgba(210,58,84,.55), transparent 70%), linear-gradient(160deg, #6b1628, #4a0f1c 60%, #2b0711); }
body[data-tema=namorados] .hero.com-capa { background: linear-gradient(100deg, rgba(43,7,17,.9) 0%, rgba(43,7,17,.6) 45%, rgba(43,7,17,.22) 100%), var(--capa) center / cover no-repeat; }

body[data-tema=verao] { --vinho: #0f4c5c; --vinho-2: #17677a; --rosa: #e0704f; --rosa-escuro: #c9573a; --rosa-claro: #fdf3ea; --ouro: #f4b860; --ouro-claro: #ffe0a3; --creme: #fffaf3; --brilho-tema: rgba(255,224,163,.25); }
body[data-tema=verao] .hero { background: radial-gradient(60% 55% at 78% 40%, rgba(244,184,96,.5), transparent 70%), radial-gradient(45% 45% at 8% 95%, rgba(224,112,79,.35), transparent 70%), linear-gradient(170deg, #17677a, #0f4c5c 60%, #0a3540); }
body[data-tema=verao] .hero.com-capa { background: linear-gradient(100deg, rgba(10,53,64,.88) 0%, rgba(10,53,64,.55) 45%, rgba(10,53,64,.18) 100%), var(--capa) center / cover no-repeat; }
body[data-tema=verao] .faixa { background: var(--rosa); color: #fff; }

/* Giro de 360° */
.selo.giro { background: linear-gradient(135deg, var(--ouro-claro), var(--ouro)); color: var(--vinho); display: inline-flex; align-items: center; gap: 4px; }
.giro360 { position: absolute; inset: 0; z-index: 1; background: var(--rosa-claro); cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.giro360:active { cursor: grabbing; }
.giro360 img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.giro360-dica { position: absolute; left: 16px; top: 16px; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
  background: rgba(20,12,15,.72); color: #fff; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(6px); white-space: nowrap; transition: opacity .4s; pointer-events: none; }
.giro360-dica svg { width: 18px; height: 18px; animation: balanca 1.6s ease-in-out infinite; }
.giro360.mexeu .giro360-dica { opacity: 0; }
@keyframes balanca { 50% { transform: translateX(5px); } }
.giro360-carga { position: absolute; left: 0; top: 0; height: 3px; background: var(--ouro); transition: width .2s, opacity .4s; }
.prov-mini .bt-360 { display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--vinho); background: linear-gradient(135deg, var(--ouro-claro), var(--ouro)); }

/* Compartilhar a peça */
.compartilhar { position: absolute; right: 64px; top: 14px; z-index: 3; height: 42px; padding: 0 14px; border-radius: 999px; border: 0; background: rgba(255,255,255,.9); display: inline-flex; align-items: center; gap: 7px;
  font-weight: 700; font-size: 13.5px; color: var(--vinho); box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.compartilhar svg { width: 17px; height: 17px; }
@media (max-width: 600px) { .compartilhar { width: 42px; padding: 0; justify-content: center; } .compartilhar span { display: none; } }
@media (max-width: 860px) { .contagem { align-items: center; } .contagem span { min-width: 56px; } .hero-marca { right: 50%; transform: translateX(50%); bottom: 2%; font-size: 26vw; } }

/* Fotos: brilho de carregamento e aparecem suavemente */
@keyframes carregando { to { background-position: -200% 0; } }
.peca-foto, .nov-foto, .anel figure { background: linear-gradient(100deg, var(--rosa-claro) 35%, #fff 50%, var(--rosa-claro) 65%) 0 0 / 200% 100%; animation: carregando 1.4s linear infinite; }
.anel figure { background-color: #3a2a30; background-image: linear-gradient(100deg, #3a2a30 35%, #4a3740 50%, #3a2a30 65%); }
.peca-foto:has(img.ok), .nov-foto:has(img.ok), .anel figure:has(img.ok), .peca-foto:has(.sem) { animation: none; }
.peca-foto img, .nov-foto img, .anel figure img { opacity: 0; transition: opacity .5s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
.peca-foto img.ok, .nov-foto img.ok, .anel figure img.ok { opacity: 1; }

/* Galeria da peça: passar com o dedo, contador e lupa */
.prov-fotos { touch-action: pan-y; cursor: zoom-in; }
.prov-fotos.girando { cursor: default; }
.prov-mini { right: 12px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.prov-mini::-webkit-scrollbar { display: none; }
.prov-mini button { flex-shrink: 0; }
.prov-conta { position: absolute; right: 14px; bottom: 92px; z-index: 2; padding: 5px 10px; border-radius: 999px; background: rgba(20,12,15,.6); color: #fff; font-size: 12px; font-weight: 700; backdrop-filter: blur(6px); }
.bt-lupa { position: absolute; right: 12px; top: 50%; z-index: 2; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); color: var(--vinho); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.18); transition: transform .2s; }
.bt-lupa:hover { transform: scale(1.08); }
.bt-lupa svg { width: 20px; height: 20px; }
.prov-fotos.girando .bt-lupa, .prov-fotos.girando .prov-conta { display: none; }
.prov-fotos:not(:has(.prov-mini)) .prov-conta { bottom: 14px; }

.lupa { position: fixed; inset: 0; z-index: 90; background: rgba(12,8,10,.96); opacity: 0; transition: opacity .25s; }
.lupa.aberta { opacity: 1; }
.lupa-palco { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: zoom-in; user-select: none; -webkit-user-select: none; }
.lupa.perto .lupa-palco { cursor: grab; }
.lupa-palco img { width: 100%; height: 100%; object-fit: contain; transform-origin: center; will-change: transform; pointer-events: none; }
.lupa-fechar { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top)); z-index: 2; font-size: 18px; font-weight: 700; color: var(--vinho); }
.lupa-seta { position: absolute; top: 50%; z-index: 2; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font-size: 30px; line-height: 1; display: grid; place-items: center; backdrop-filter: blur(6px); }
.lupa-seta.ant { left: 16px; } .lupa-seta.prox { right: 16px; }
.lupa.perto .lupa-seta, .lupa.perto .lupa-dica { opacity: 0; pointer-events: none; }
.lupa-conta { position: absolute; left: 16px; top: calc(22px + env(safe-area-inset-top)); color: rgba(255,255,255,.75); font-weight: 700; font-size: 14px; }
.lupa-dica { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.85); font-size: 13px; white-space: nowrap; transition: opacity .3s; pointer-events: none; }

/* Chegou essa semana */
.chegou { padding: 64px 0 6px; max-width: 1400px; margin: 0 auto; }
.chegou-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 0 clamp(16px, 5vw, 72px); margin-bottom: 20px; }
.chegou-cab h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 4vw, 48px); margin: 6px 0 0; line-height: 1; }
.chegou-cab .kicker { color: var(--rosa); }
.chegou-cab .kicker::before { background: var(--rosa); }
.chegou-setas { display: flex; gap: 8px; }
.chegou-setas button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--borda); background: #fff; font-size: 24px; line-height: 1; color: var(--vinho); display: grid; place-items: center; box-shadow: 0 6px 16px -10px rgba(77,49,57,.5); transition: all .2s; }

.chegou-trilho { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px clamp(16px, 5vw, 72px) 30px; scroll-padding: 0 clamp(16px, 5vw, 72px); scrollbar-width: none; perspective: 1200px; }
.chegou-trilho::-webkit-scrollbar { display: none; }
.nov { position: relative; flex: 0 0 clamp(200px, 22vw, 270px); scroll-snap-align: start; border-radius: 26px; overflow: hidden; background: #fff; cursor: pointer; box-shadow: 0 16px 34px -20px rgba(77,49,57,.55);
  opacity: 0; transform: translateX(60px) rotateY(-18deg); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1), box-shadow .3s; transition-delay: var(--atraso, 0s); }

.nov-tag { position: absolute; left: 12px; top: 12px; padding: 5px 11px; border-radius: 999px; background: var(--vinho); color: var(--ouro-claro); font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; }

.nov-txt span { font-size: 15px; font-weight: 800; color: var(--ouro-claro); }
@media (max-width: 860px) { .chegou-setas { display: none; } .chegou { padding-top: 48px; } .nov { flex-basis: 62vw; } .prov-conta { bottom: 86px; } }
@media (prefers-reduced-motion: reduce) { .nov { opacity: 1; transform: none; } .peca-foto, .nov-foto, .anel figure { animation: none; } }

/* Favoritas */
.bt-fav { position: absolute; right: 12px; bottom: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: var(--vinho); display: grid; place-items: center;
  box-shadow: 0 6px 14px rgba(0,0,0,.15); transition: transform .2s; transform: translateZ(2px); }

.bt-fav-g { position: static; transform: none; width: 52px; height: 52px; flex: 0 0 52px; border: 1.5px solid var(--borda); box-shadow: none; }

.bt-favs svg { width: 20px; height: 20px; }

.cats .c-fav.sel { background: #e0245e; border-color: #e0245e; }

/* Filtros */
.cats .bt-filtro { display: inline-flex; align-items: center; gap: 7px; border-color: var(--vinho); color: var(--vinho); }
.cats .bt-filtro svg { width: 17px; height: 17px; }
.cats .bt-filtro small { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--ouro); color: var(--vinho); margin: 0; font-size: 11px; }

.filtros { background: #fff; border: 1px solid var(--borda); border-radius: 22px; padding: 18px 20px; margin: -6px 0 20px; display: flex; flex-direction: column; gap: 14px;

.link-limpar { border: 0; background: none; color: var(--rosa-escuro); font-weight: 700; text-decoration: underline; padding: 0; }

/* Vídeo da peça */

/* Qual o meu tamanho? */
.h4-tam { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.link-medidas { border: 0; background: none; padding: 0; color: var(--rosa-escuro); font-weight: 700; font-size: 13px; letter-spacing: 0; text-transform: none; text-decoration: underline; text-underline-offset: 3px; }
.medidas { background: #fff; border: 1px solid var(--borda); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: entra-item .3s ease; }
.medidas table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: center; }
.medidas th, .medidas td { padding: 7px 4px; border-bottom: 1px solid #f1eaec; }
.medidas thead th { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--suave); }
.medidas tbody tr { color: #a99da3; }
.medidas tbody tr.tem { color: var(--texto); font-weight: 700; }
.medidas tbody tr.sugerido { background: var(--ouro-claro); color: var(--vinho); }
.medidas-nota { color: var(--suave); font-size: 12px; }
.medidas-ajuda { background: var(--rosa-claro); border-radius: 14px; padding: 12px; }
.medidas-ajuda > b { font-size: 13.5px; }
.medidas-campos { display: flex; gap: 8px; margin-top: 8px; }
.medidas-campos label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--suave); min-width: 0; }
.medidas-campos input { width: 100%; font: inherit; font-size: 16px; padding: 9px 10px; border-radius: 12px; border: 1.5px solid var(--borda); background: #fff; outline: none; }
.medidas-campos input:focus { border-color: var(--rosa); }
.medidas-r { margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
.medidas-r:empty { display: none; }

/* Stories */
.stories { grid-column: 1 / -1; position: relative; z-index: 3; display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding: 4px 2px 2px; margin-bottom: -10px; }
.stories::-webkit-scrollbar { display: none; }
.story { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; color: #fff; padding: 0; width: 76px; }
.story small { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.story-anel { display: block; width: 72px; height: 72px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, var(--ouro-claro), var(--ouro), #e0705f, var(--rosa), var(--ouro-claro)); transition: transform .2s; }
.story:hover .story-anel { transform: scale(1.06); }
.story.bf .story-anel { background: conic-gradient(from 200deg, #ffe266, #ffcc00, #ff5a3c, #ffcc00, #ffe266); }
.story.visto .story-anel { background: rgba(255,255,255,.28); }
.story-img { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid var(--vinho); background: var(--rosa-claro); color: var(--vinho); }
.story-img img { width: 100%; height: 100%; object-fit: cover; }
.story-img svg { width: 24px; height: 24px; }
.hero.com-stories { padding-top: 96px; align-content: center; }

.story-tela { position: fixed; inset: 0; z-index: 85; background: rgba(10,6,8,.94); display: grid; place-items: center; opacity: 0; transition: opacity .25s; }
.story-tela.aberta { opacity: 1; }
.story-caixa { position: relative; width: min(440px, 100vw); height: min(92svh, 800px); border-radius: 22px; overflow: hidden; background: #111; user-select: none; -webkit-user-select: none; touch-action: none;
  transform: scale(.94); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.story-tela.aberta .story-caixa { transform: none; }
.story-midia { position: absolute; inset: 0; }
.story-midia img, .story-midia video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.story-midia img.kb { animation: kenburns 6s ease-out both; }

.story-tela.pausado .story-midia img.kb { animation-play-state: paused; }
.story-barras { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 3; display: flex; gap: 4px; }

.story-topo .espaco { flex: 1; }
.story-av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid #fff; background: var(--vinho); }
.story-av img { width: 100%; height: 100%; object-fit: cover; }
.story-topo b { font-size: 14px; }
.story-bt { width: 40px; height: 40px; border: 0; background: none; color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 700; }
.story-bt svg { width: 22px; height: 22px; }
.story-lado { position: absolute; top: 80px; bottom: 170px; z-index: 2; width: 40%; border: 0; background: none; padding: 0; }
.story-lado.ant { left: 0; } .story-lado.prox { right: 0; width: 60%; }
.story-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 90px 20px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(10,6,8,.85) 45%); color: #fff; }
.story-info small { font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ouro-claro); }
.story-info h3 { font-family: var(--serif); font-size: 28px; font-weight: 600; margin: 4px 0 6px; line-height: 1.1; }
.story-preco { margin-bottom: 14px; font-size: 15px; }
.story-preco s { color: rgba(255,255,255,.6); }
.story-preco b { font-size: 22px; color: var(--ouro-claro); }
.story-info .bt-ouro { width: 100%; justify-content: center; }
@media (max-width: 600px) { .story-caixa { width: 100vw; height: 100svh; border-radius: 0; } .stories { gap: 12px; } .story { width: 68px; } .story-anel { width: 64px; height: 64px; }
  .bt-fav { width: 34px; height: 34px; right: 8px; bottom: 8px; } .bt-fav svg { width: 17px; height: 17px; } .bt-fav-g { width: 48px; height: 48px; flex-basis: 48px; } .bt-fav-g svg { width: 20px; height: 20px; }
  .filtros { padding: 16px; } .medidas-campos input { padding: 8px; }
  .prov-acoes .bt-linha { flex: 1; white-space: nowrap; padding: 14px 12px; } .prov-acoes .bt-ouro { flex: 1 1 100%; order: 3; } }

@media (max-width: 860px) {
  .stories { order: -2; justify-content: flex-start; }
  .hero.com-stories { padding-top: 78px; }
  .hero { grid-template-columns: 1fr; padding-top: 90px; text-align: center; min-height: auto; }
  .hero p { margin-left: auto; margin-right: auto; }
  .hero-acoes, .hero-nums { justify-content: center; }

}
@media (max-width: 600px) {

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .peca { opacity: 1; transform: none; }
}
