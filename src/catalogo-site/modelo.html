  <div class="gaveta-cab"><h3>Minha sacola</h3><button class="fechar" id="fechar-gaveta" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="gaveta-lista" id="gaveta-lista"></div>
  <div class="gaveta-pe" id="gaveta-pe"></div>
</aside>
<div class="toast" id="toast"></div>
<div class="story-tela" id="story-tela" hidden role="dialog" aria-modal="true" aria-label="Novidades">
  <div class="story-caixa" id="story-caixa">
    <div class="story-midia" id="story-midia"></div>
    <div class="story-barras" id="story-barras"></div>
    <div class="story-topo"><span class="story-av" id="story-av"></span><b id="story-grupo"></b><span class="espaco"></span>
      <button class="story-bt" id="story-som" aria-label="Som" hidden></button><button class="story-bt" id="story-x" aria-label="Fechar">✕</button></div>
    <button class="story-lado ant" data-sl="-1" aria-label="Anterior"></button><button class="story-lado prox" data-sl="1" aria-label="Próxima"></button>
    <div class="story-info"><small id="story-cat"></small><h3 id="story-nome"></h3><div class="story-preco" id="story-preco"></div>
      <button class="bt-ouro" id="story-ver">Ver a peça</button></div>
  </div>
</div>
<div class="lupa" id="lupa" hidden role="dialog" aria-modal="true" aria-label="Foto de perto">
  <div class="lupa-palco" id="lupa-palco"><img id="lupa-img" alt="" draggable="false"></div>
  <button class="lupa-seta ant" data-l="-1" aria-label="Foto anterior">‹</button>
  <button class="lupa-seta prox" data-l="1" aria-label="Próxima foto">›</button>
  <span class="lupa-conta" id="lupa-conta"></span>
  <span class="lupa-dica" id="lupa-dica"></span>
  <button class="fechar lupa-fechar" id="lupa-fechar" aria-label="Fechar">✕</button>
</div>

<script id="dados" type="application/json">__DADOS__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('dados').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (c) => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const semMouse = matchMedia('(hover: none)').matches; // celular: sem inclinação que segue o mouse
  const zap = (texto) => (D.whatsapp ? `https://wa.me/${D.whatsapp}${texto ? `?text=${encodeURIComponent(texto)}` : ''}` : null);
  const ICONE_MAIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const ICONE_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  const ICONE_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>';
  const ICONE_SOM = (mudo) => (mudo ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>');
  const ICONE_LUPA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>';
  /** Todas as fotos da peça: uma por cor e depois as "mais fotos" (costas, detalhe…). */
  const fotosDa = (p) => [...p.fotos, ...(p.mais || [])];
  const OK = 'onload="this.classList.add(\'ok\')" onerror="this.classList.add(\'ok\')"';
  const ICONE_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>';
  const ICONE_GIRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 4 0 1 1-6-3.8"/><path d="m13 6 3 2.2L13.6 11"/></svg>';
  // Formas de pagamento e benefícios
  const ICONE_PIX = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 17.3a2.9 2.9 0 0 1-2.1-.9l-3-3a.6.6 0 0 0-.8 0l-3 3a2.9 2.9 0 0 1-2.1.9H6l3.8 3.8a3 3 0 0 0 4.3 0l3.9-3.8h-.4ZM6.6 6.7a2.9 2.9 0 0 1 2.1.9l3 3c.2.2.6.2.8 0l3-3a2.9 2.9 0 0 1 2.1-.9h.4l-3.9-3.8a3 3 0 0 0-4.3 0L6 6.7h.6Z"/><path d="m21.1 9.9-2.3-2.3h-1.2c-.5 0-1 .2-1.4.6l-3 3a1.5 1.5 0 0 1-2.1 0l-3-3a2 2 0 0 0-1.4-.6H5.2L2.9 9.9a3 3 0 0 0 0 4.2l2.3 2.3h1.4c.5 0 1-.2 1.4-.6l3-3c.6-.6 1.5-.6 2.1 0l3 3c.4.4.9.6 1.4.6h1.2l2.3-2.3a3 3 0 0 0 .1-4.2Z"/></svg>';
  const ICONE_DINHEIRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/></svg>';
  const ICONE_CARTAO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>';
  const ICONE_LOJA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
  const ICONE_CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
  const ICONE_RELOGIO ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  /** Preço no Pix e no dinheiro (com o desconto da loja), em centavos. */
  const precoPix = (c) => Math.round(c * (100 - (D.descontoPix || 0)) / 100);
  /** Selos com as formas de pagamento aceitas. */
  const pagamentosHtml = () => `<div class="pagamentos">
    <span class="pg-pix">${ICONE_PIX} Pix${D.descontoPix ? ` −${D.descontoPix}%` : ''}</span>
    <span class="pg-din">${ICONE_DINHEIRO} Dinheiro${D.descontoPix ? ` −${D.descontoPix}%` : ''}</span>
    <span class="pg-cartao">${ICONE_CARTAO} Cartão${D.parcelas ? ` até ${D.parcelas}x sem juros` : ''}</span></div>`;
  /** Cartão "Formas de pagamento" com quanto fica em cada forma (valor em centavos). */
  const pagamentosValorHtml = (v) => {
    const off = D.descontoPix ? `<em>−${D.descontoPix}%</em>` : '';
    const parc = D.parcelas > 1 && v >= D.parcelas * 1000 ? D.parcelas : 1;
    return `<div class="pg-cartao-box"><h5>Formas de pagamento</h5>
      <div class="pg-linha pix"><i>${ICONE_PIX}</i><span>Pix${off}<small>na loja, na hora de retirar</small></span><b>${brl(precoPix(v))}</b></div>
      <div class="pg-linha din"><i>${ICONE_DINHEIRO}</i><span>Dinheiro${off}<small>à vista</small></span><b>${brl(precoPix(v))}</b></div>
      <div class="pg-linha"><i>${ICONE_CARTAO}</i><span>Cartão<small>${parc > 1 ? 'crédito, sem juros' : 'débito ou crédito'}</small></span><b>${parc > 1 ? `${parc}x de ${brl(Math.ceil(v / parc))}` : brl(v)}</b></div></div>`;
  };

  // ---------- Tema de época (Black Friday, Natal...): cores, frases e contagem regressiva até o fim
  const TEMAS = {
    black_friday: { nome: 'Black Friday', titulo: 'Black Friday', marca: 'BLACK', cor: '#0e0c0d',
      sub: 'Os melhores preços do ano na loja toda. Corre, que as peças são poucas!', frases: ['Black Friday', 'Descontos de verdade', 'Peças limitadas'],
      contagem: 'As ofertas acabam em', particulas: { cores: ['255,204,0', '255,120,70'], sobe: true } },
    natal: { nome: 'Natal', titulo: 'Presentes de Natal', marca: 'NATAL', cor: '#123524',
      sub: 'O presente perfeito está aqui (e um mimo para você também). Separamos e embalamos para presente!', frases: ['Feliz Natal', 'Embalamos para presente', 'Troca garantida'],
      contagem: 'Faltam para o Natal', particulas: { cores: ['255,255,255'], sobe: false } },
    maes: { nome: 'Dia das Mães', titulo: 'Para a melhor mãe', marca: 'MÃE', cor: '#5a2140',
      sub: 'Presentes lindos para quem merece tudo. Escolha, separe e a gente embala com carinho.', frases: ['Feliz Dia das Mães', 'Embalamos para presente', 'Troca garantida'],
      contagem: 'Faltam para o Dia das Mães', particulas: { cores: ['255,217,228', '255,255,255'], sobe: true, coracao: true } },
    namorados: { nome: 'Dia dos Namorados', titulo: 'Dia dos Namorados', marca: 'AMOR', cor: '#4a0f1c',
      sub: 'Para arrasar no encontro ou presentear quem você ama. Separamos para você!', frases: ['Dia dos Namorados', 'Embalamos para presente'],
      contagem: 'Faltam para o Dia dos Namorados', particulas: { cores: ['255,198,210', '255,255,255'], sobe: true, coracao: true } },
    verao: { nome: 'Verão', titulo: 'Coleção Verão', marca: 'VERÃO', cor: '#0f4c5c',
      sub: 'Leveza, cor e muito estilo para os dias de sol. Escolha as suas favoritas!', frases: ['Coleção Verão', 'Leveza e cor'],
      contagem: 'A coleção acaba em', particulas: { cores: ['255,224,163', '255,255,255'], sobe: true } },
  };
  const fimTema = D.tema && D.tema.fim ? new Date(D.tema.fim) : null;
  const T = D.tema && TEMAS[D.tema.id] && !(fimTema && fimTema <= new Date()) ? TEMAS[D.tema.id] : null;
  if (T) {
    document.body.dataset.tema = D.tema.id;
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = T.cor;
    $('#hero-marca').textContent = T.marca;
  }
  if (D.capa) {
    $('#hero').classList.add('com-capa');
    $('#hero').style.setProperty('--capa', `url("${D.capa}")`);
  }
  if (T && fimTema) {
    const cont = $('#contagem');
    cont.hidden = false;
    const tic = () => {
      const r = Math.max(0, fimTema - new Date());
      if (!r) { cont.hidden = true; return; }
      const d = Math.floor(r / 864e5);
      const h = Math.floor(r / 36e5) % 24;
      const m = Math.floor(r / 6e4) % 60;
      const sg = Math.floor(r / 1e3) % 60;
      const dd = (n) => String(n).padStart(2, '0');
      cont.innerHTML = `<small>${esc(T.contagem)}</small><div>${[[d, d === 1 ? 'dia' : 'dias'], [dd(h), 'horas'], [dd(m), 'min'], [dd(sg), 'seg']]
        .map(([n, t]) => `<span><b>${n}</b><i>${t}</i></span>`).join('')}</div>`;
      setTimeout(tic, 1000 - (Date.now() % 1000));
    };
    tic();
  }

  // ---------- Textos da loja
  const titulo = D.titulo || (T ? T.titulo : '');
  document.title = titulo ? `${titulo} · ${D.loja}` : D.loja;
  $('#kicker').textContent = T ? `${T.nome} · ${D.loja}` : D.kicker;
  $('#titulo').innerHTML = titulo
    ? esc(titulo).replace(/(\S+)$/, '<em>$1</em>')
    : `${esc(D.loja).replace(/(\S+)$/, '<em>$1</em>')}`;
  $('#subtitulo').textContent = T && !D.subtituloProprio ? T.sub : D.subtitulo;
  $('#hero-nums').innerHTML = [[D.pecas.length, D.pecas.length === 1 ? 'peça' : 'peças'], [D.categorias.length, D.categorias.length === 1 ? 'categoria' : 'categorias'],
    D.parcelas ? [`${D.parcelas}x`, 'sem juros'] : null].filter(Boolean).map(([n, t]) => `<div><b>${n}</b><span>${t}</span></div>`).join('');
  const frases = [...(T ? T.frases : []), D.parcelas ? `Parcele em até ${D.parcelas}x sem juros` : null,
    D.descontoPix ? `${D.descontoPix}% off no Pix ou dinheiro` : 'Pix, cartão e dinheiro', 'Novidades toda semana', D.instagram ? `Siga ${D.instagram}` : null,
    D.pedidos ? 'Reserve pelo site e retire na loja' : 'Separamos a sua peça', 'Peça pelo WhatsApp'].filter(Boolean);
  $('#beneficios').innerHTML = [
    ['pix', ICONE_PIX, D.descontoPix ? `${D.descontoPix}% off no Pix` : 'Pix', D.descontoPix ? 'e também no dinheiro' : 'na hora, sem taxa'],
    ['', ICONE_DINHEIRO, 'Dinheiro', D.descontoPix ? `com ${D.descontoPix}% de desconto` : 'pagando na loja'],
    ['', ICONE_CARTAO, D.parcelas ? `Até ${D.parcelas}x sem juros` : 'Cartão', D.parcelas ? 'no cartão de crédito' : 'débito e crédito'],
    D.pedidos ? ['', ICONE_LOJA, 'Reserve e retire', `separamos por ${D.prazoReserva} dias`] : ['', ICONE_RELOGIO, 'Peça pelo WhatsApp', 'a gente separa pra você'],
  ].map(([c, ic, b, s]) => `<div class="beneficio ${c}"><i>${ic}</i><div><b>${esc(b)}</b><small>${esc(s)}</small></div></div>`).join('');
  $('#faixa').innerHTML = [...frases, ...frases, ...frases, ...frases].map((f) => `<span>${esc(f)}</span>`).join('');
  $('#rod-endereco').textContent = [D.endereco, D.cidade].filter(Boolean).join(' · ');
  $('#rod-contato').innerHTML = [D.telefone && `<a href="${zap('Oi! Vim pelo catálogo.')}" target="_blank" rel="noopener">WhatsApp ${esc(D.telefone)}</a>`,
    D.instagram && `<a href="https://instagram.com/${encodeURIComponent(D.instagram.replace(/^@/, ''))}" target="_blank" rel="noopener">${esc(D.instagram)}</a>`].filter(Boolean).join(' · ');
  $('#rod-atualizado').textContent = `Catálogo atualizado em ${D.atualizado}. Preços e tamanhos sujeitos à disponibilidade.`;
  for (const id of ['#topo-zap', '#hero-zap', '#zap-flutuante']) {
    const a = $(id);
    const url = zap('Oi! Vim pelo catálogo e quero saber mais.');
    if (url) a.href = url; else a.hidden = true;
  }

  // ---------- Abertura
  addEventListener('load', () => setTimeout(() => $('#abertura').classList.add('fora'), calmo ? 0 : 900));
  setTimeout(() => $('#abertura').classList.add('fora'), 3500);

  // ---------- Topo fica sólido ao rolar
  const topo = $('#topo');
  addEventListener('scroll', () => topo.classList.toggle('solido', scrollY > 40), { passive: true });

  // ---------- Poeira dourada (canvas leve)
  (() => {
    if (calmo) return;
    const cv = $('#poeira');
    const ctx = cv.getContext('2d');
    let w; let h; let ps = [];
    const P = (T && T.particulas) || { cores: ['243,207,114'], sobe: true };
    const cores = P.cores;
    const tamanho = () => {
      const r = Math.min(2, devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = w * r; cv.height = h * r; cv.style.width = `${w}px`; cv.style.height = `${h}px`;
      ctx.setTransform(r, 0, 0, r, 0, 0);
      ps = Array.from({ length: Math.round(Math.min(70, w / 18)) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + .4,
        v: Math.random() * .35 + .1, d: Math.random() * Math.PI * 2, a: Math.random() * .5 + .2, c: cores[Math.floor(Math.random() * cores.length)] }));
    };
    tamanho();
    addEventListener('resize', tamanho);
    let limpo = false;
    const passo = () => {
      const fade = Math.max(0, 1 - scrollY / (h * .9));
      if (!fade || document.hidden) {
        if (!limpo) { ctx.clearRect(0, 0, w, h); limpo = true; }
        setTimeout(() => requestAnimationFrame(passo), 250);
        return;
      }
      limpo = false;
      ctx.clearRect(0, 0, w, h);
      if (fade > 0) {
        for (const p of ps) {
          p.y += P.sobe ? -p.v : p.v * 1.6; p.d += .01; p.x += Math.sin(p.d) * .3;
          if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
          if (p.y > h + 5) { p.y = -5; p.x = Math.random() * w; }
          ctx.beginPath();
          ctx.fillStyle = `rgba(${p.c},${p.a * fade})`;
          ctx.shadowColor = `rgba(${p.c},.9)`;
          ctx.shadowBlur = 8;
          if (P.coracao && p.r > 1.2) {
            const k = p.r * 2.4;
            ctx.moveTo(p.x, p.y + k * .9);
            ctx.bezierCurveTo(p.x - k * 1.6, p.y - k * .2, p.x - k * .6, p.y - k * 1.3, p.x, p.y - k * .4);
            ctx.bezierCurveTo(p.x + k * .6, p.y - k * 1.3, p.x + k * 1.6, p.y - k * .2, p.x, p.y + k * .9);
          } else {
            ctx.arc(p.x, p.y, P.sobe ? p.r : p.r * 1.3, 0, Math.PI * 2);
          }
          ctx.fill();
        }
      }
      requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  })();

  // ---------- Carrossel 3D (gira sozinho; arraste para girar)
  (() => {
    const destaques = D.pecas.filter((p) => p.fotos.length).sort((a, b) => (b.destaque - a.destaque)).slice(0, 10);
    const anel = $('#anel');
    const palco = $('#palco');
    if (destaques.length < 3) { palco.hidden = true; return; }
    const n = destaques.length;
    const largura = () => Math.min(240, Math.max(150, innerWidth * (innerWidth < 860 ? .38 : .16)));
    let raio = 0;
    const montar = () => {
      const lw = largura();
      raio = Math.round((lw / 2) / Math.tan(Math.PI / n) + 40);
      anel.style.setProperty('--w', `${lw}px`);
      anel.innerHTML = destaques.map((p, i) => `<figure data-id="${p.id}" style="transform: rotateY(${(360 / n) * i}deg) translateZ(${raio}px)">
        <img src="${p.fotos[0]}" alt="${esc(p.nome)}" draggable="false" decoding="async" ${OK}><figcaption>${esc(p.nome)}${D.mostrarPreco ? `<b>${brl(p.preco)}</b>` : ''}</figcaption></figure>`).join('');
    };
    montar();
    addEventListener('resize', montar);
    let ang = 0; let vel = calmo ? 0 : -.12; let arrasto = null; let mexeu = 0;
    const desenhar = () => { anel.style.transform = `translateZ(${-raio}px) rotateX(-6deg) rotateY(${ang}deg)`; };
    let palcoVisivel = true;
    new IntersectionObserver((es) => { palcoVisivel = es[0].isIntersecting; }).observe(palco);
    const girar = () => {
      // Fora da tela (ou com a peça aberta), o carrossel descansa: economiza bateria no celular.
      if ((!palcoVisivel || !cortina.hidden || document.hidden) && !arrasto) { setTimeout(() => requestAnimationFrame(girar), 250); return; }
      if (!arrasto) { ang += vel; vel += ((calmo ? 0 : -.12) - vel) * .02; }
      desenhar();
      requestAnimationFrame(girar);
    };
    requestAnimationFrame(girar);
    palco.addEventListener('pointerdown', (e) => { arrasto = { x: e.clientX, a: ang, t: performance.now(), ultX: e.clientX }; mexeu = 0; palco.setPointerCapture(e.pointerId); });
    palco.addEventListener('pointermove', (e) => {
      if (!arrasto) return;
      const dx = e.clientX - arrasto.x;
      mexeu = Math.max(mexeu, Math.abs(dx));
      ang = arrasto.a + dx * .35;
      vel = (e.clientX - arrasto.ultX) * .35;
      arrasto.ultX = e.clientX;
    });
    const soltar = (e) => {
      if (!arrasto) return;
      arrasto = null;
      if (mexeu < 6) {
        const f = document.elementsFromPoint(e.clientX, e.clientY).find((el) => el.closest && el.closest('figure[data-id]'));
        if (f) abrirPeca(Number(f.closest('figure').dataset.id));
      }
    };
    palco.addEventListener('pointerup', soltar);
    palco.addEventListener('pointercancel', () => { arrasto = null; });
  })();

  // ---------- Vitrine
  // ---------- Favoritas (ficam guardadas neste celular)
  const CHAVE_FAV = `favoritas-${D.loja}`;
  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(CHAVE_FAV) || '[]').filter((lk) => D.pecas.some((p) => p.lk === lk))); } catch { favs = new Set(); }
  const ICONE_CORACAO = '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.4-9.4-9.2C1.3 7.9 3.4 4.5 6.9 4.5c2.1 0 3.7 1.2 5.1 3 1.4-1.8 3-3 5.1-3 3.5 0 5.6 3.4 4.3 6.8-1.9 4.8-9.4 9.2-9.4 9.2Z"/></svg>';
  const coracao = (p, classe = 'bt-fav') => `<button class="${classe} ${favs.has(p.lk) ? 'on' : ''}" data-fav="${p.lk}" aria-label="Favoritar" aria-pressed="${favs.has(p.lk)}">${ICONE_CORACAO}</button>`;
  function marcarFav(lk) {
    const on = !favs.has(lk);
    if (on) favs.add(lk); else favs.delete(lk);
    try { localStorage.setItem(CHAVE_FAV, JSON.stringify([...favs])); } catch { /* só nesta visita */ }
    document.querySelectorAll(`[data-fav="${lk}"]`).forEach((b) => {
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
      b.classList.remove('pulsa'); void b.offsetWidth; if (on) b.classList.add('pulsa');
    });
    desenharFavsTopo();
    desenharCats();
    if (categoria === '__fav') { if (!favs.size) categoria = ''; desenharGrade(); }
    toast(on ? 'Guardada nas suas favoritas ❤️' : 'Tirada das favoritas');
  }
  function desenharFavsTopo() {
    const b = $('#bt-favs');
    b.hidden = !favs.size;
    $('#favs-n').textContent = favs.size;
  }
  $('#bt-favs').onclick = () => {
    categoria = '__fav';
    desenharCats();
    desenharGrade();
    scrollTo({ top: $('#vitrine').offsetTop + ($('#chegou').hidden ? 0 : $('#chegou').offsetHeight), behavior: calmo ? 'auto' : 'smooth' });
  };

  // ---------- Vitrine: categorias, busca, filtros (tamanho, cor, preço) e ordem
  let categoria = '';
  const F = { tams: new Set(), cores: new Set(), preco: '', ordem: '' };
  const FAIXAS = [['0-10000', 'Até R$ 100'], ['10000-20000', 'R$ 100 a 200'], ['20000-30000', 'R$ 200 a 300'], ['30000-50000', 'R$ 300 a 500'], ['50000-', 'Acima de R$ 500']]
    .filter(([k]) => { const [a, b] = k.split('-').map(Number); return D.pecas.some((p) => p.preco >= a && (!b || p.preco < b)); });
  const ORDENS = [['', 'Destaques'], ['menor', 'Menor preço'], ['maior', 'Maior preço'], ['novas', 'Novidades']];
  const cats = $('#cats');
  const contar = (c) => D.pecas.filter((p) => !c || p.categoria === c).length;
  const nFiltros = () => F.tams.size + F.cores.size + (F.preco ? 1 : 0) + (F.ordem ? 1 : 0);
  const ICONE_FILTRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>';
  function desenharCats() {
    const n = nFiltros();
    cats.innerHTML = `<button class="bt-filtro ${n ? 'sel' : ''}" data-filtro aria-expanded="${!$('#filtros').hidden}">${ICONE_FILTRO} Filtrar${n ? `<small>${n}</small>` : ''}</button>`
      + [['', 'Todas'], ...(favs.size ? [['__fav', '❤ Favoritas']] : []), ...D.categorias.map((c) => [c, c])]
        .map(([k, t]) => `<button data-c="${esc(k)}" class="${k === categoria ? 'sel' : ''} ${k === '__fav' ? 'c-fav' : ''}">${esc(t)}<small>${k === '__fav' ? favs.size : contar(k)}</small></button>`).join('');
  }
  cats.onclick = (e) => {
    if (e.target.closest('[data-filtro]')) return abrirFiltros();
    const b = e.target.closest('[data-c]');
    if (!b) return;
    categoria = b.dataset.c;
    desenharCats();
    desenharGrade();
    const g = $('#vitrine');
    if (g.getBoundingClientRect().top < 0) scrollTo({ top: cats.getBoundingClientRect().top + scrollY - 70, behavior: calmo ? 'auto' : 'smooth' });
  };
  const semAcento = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  $('#q').addEventListener('input', () => desenharGrade());

  function filtrar() {
    const q = semAcento($('#q').value.trim());
    const [pa, pb] = F.preco ? F.preco.split('-').map(Number) : [0, 0];
    const lista = D.pecas.filter((p) => (!categoria || (categoria === '__fav' ? favs.has(p.lk) : p.categoria === categoria))
      && (!q || semAcento([p.nome, p.categoria, p.cores.join(' '), p.tamanhos.join(' '), p.num].join(' ')).includes(q))
      && (!F.tams.size || p.tamanhos.some((t) => F.tams.has(t)))
      && (!F.cores.size || p.cores.some((c) => F.cores.has(c)))
      && (!F.preco || (p.preco >= pa && (!pb || p.preco < pb))));
    if (F.ordem === 'menor') lista.sort((a, b) => a.preco - b.preco);
    if (F.ordem === 'maior') lista.sort((a, b) => b.preco - a.preco);
    if (F.ordem === 'novas') lista.sort((a, b) => (b.chegou - a.chegou) || (b.novo - a.novo) || (b.lk - a.lk));
    return lista;
  }
  function desenharFiltros() {
    const fl = $('#filtros');
    const chip = (grupo, v, t, sel) => `<button data-${grupo}="${esc(v)}" class="${sel ? 'sel' : ''}">${esc(t)}</button>`;
    fl.innerHTML = `
      ${D.tamanhos.length > 1 ? `<div class="filtro-grupo"><h4>Tamanho</h4><div class="escolha">${D.tamanhos.map((t) => chip('ft', t, t, F.tams.has(t))).join('')}</div></div>` : ''}
      ${D.cores.length > 1 ? `<div class="filtro-grupo"><h4>Cor</h4><div class="escolha">${D.cores.map((c) => chip('fc', c, c, F.cores.has(c))).join('')}</div></div>` : ''}
      ${D.mostrarPreco && FAIXAS.length > 1 ? `<div class="filtro-grupo"><h4>Preço</h4><div class="escolha">${FAIXAS.map(([k, t]) => chip('fp', k, t, F.preco === k)).join('')}</div></div>` : ''}
      <div class="filtro-grupo"><h4>Ordenar por</h4><div class="escolha">${ORDENS.filter(([k]) => D.mostrarPreco || !['menor', 'maior'].includes(k)).map(([k, t]) => chip('fo', k, t, F.ordem === k)).join('')}</div></div>
      <div class="filtros-pe"><button class="bt-voltar" id="f-limpar" ${nFiltros() ? '' : 'disabled'}>Limpar filtros</button>
        <button class="bt-pedido" id="f-ver">Ver ${filtrar().length} peça${filtrar().length === 1 ? '' : 's'}</button></div>`;
  }
  function abrirFiltros(abrir) {
    const fl = $('#filtros');
    const vai = abrir === undefined ? fl.hidden : abrir;
    if (vai) { desenharFiltros(); fl.hidden = false; requestAnimationFrame(() => fl.classList.add('aberto')); } else { fl.classList.remove('aberto'); fl.hidden = true; }
    desenharCats();
  }
  $('#filtros').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'f-ver') { abrirFiltros(false); scrollTo({ top: cats.getBoundingClientRect().top + scrollY - 70, behavior: calmo ? 'auto' : 'smooth' }); return; }
    if (b.id === 'f-limpar') { F.tams.clear(); F.cores.clear(); F.preco = ''; F.ordem = ''; } else if (b.dataset.ft !== undefined) {
      if (F.tams.has(b.dataset.ft)) F.tams.delete(b.dataset.ft); else F.tams.add(b.dataset.ft);
    } else if (b.dataset.fc !== undefined) {
      if (F.cores.has(b.dataset.fc)) F.cores.delete(b.dataset.fc); else F.cores.add(b.dataset.fc);
    } else if (b.dataset.fp !== undefined) F.preco = F.preco === b.dataset.fp ? '' : b.dataset.fp;
    else if (b.dataset.fo !== undefined) F.ordem = b.dataset.fo;
    desenharFiltros();
    desenharCats();
    desenharGrade();
  });

  const selos = (p) => [p.giro && p.giro.length && `<span class="selo giro">${ICONE_GIRO.replace('<svg', '<svg width="13" height="13"')} 360°</span>`,
    p.video && `<span class="selo video">${ICONE_PLAY.replace('<svg', '<svg width="11" height="11"')} Vídeo</span>`, p.novo && '<span class="selo novo">Novidade</span>', p.de && `<span class="selo desc">−${Math.round((1 - p.preco / p.de) * 100)}%</span>`,
    p.top && '<span class="selo top">Mais vendida</span>', p.ultima && '<span class="selo ultima">Última peça</span>'].filter(Boolean).join('');
  const precoHtml = (p) => (D.mostrarPreco ? `<div class="preco">${p.de ? `<s>${brl(p.de)}</s>` : ''}<b>${p.varia ? 'a partir de ' : ''}${brl(p.preco)}</b>
    ${D.descontoPix ? `<span class="pix">${ICONE_PIX}${brl(precoPix(p.preco))} <em>no Pix<span class="pix-din"> ou dinheiro</span></em></span>` : ''}
    ${D.parcelas && p.preco >= D.parcelas * 1000 ? `<small>ou ${D.parcelas}x de ${brl(Math.ceil(p.preco / D.parcelas))} sem juros</small>` : ''}</div>` : '');

  let observador = null;
  function desenharGrade() {
    const lista = filtrar();
    const g = $('#grade');
    const vazio = categoria === '__fav' ? 'Você ainda não tem favoritas. Toque no ❤ das peças que gostar.'
      : nFiltros() ? 'Nenhuma peça com esses filtros. <button class="link-limpar" id="limpar-vazio">Limpar filtros</button>' : 'Nenhuma peça encontrada. Tente outra busca ou fale com a gente no WhatsApp 💬';
    g.innerHTML = lista.map((p, i) => `<article class="peca" data-id="${p.id}" style="--atraso:${(i % 4) * 0.07}s" tabindex="0">
      <div class="peca-foto">${p.fotos.length ? `<img src="${p.fotos[0]}" alt="${esc(p.nome)}" loading="lazy" decoding="async" ${OK}>` : '<div class="sem">foto em breve</div>'}
        <div class="selos">${selos(p)}</div><span class="num">${p.num}</span><span class="brilho"></span>${coracao(p)}</div>
      <div class="peca-txt"><span class="peca-cat">${esc(p.categoria)}</span><h3>${esc(p.nome)}</h3>
        ${p.tamanhos.length ? `<div class="tams">${p.tamanhos.map((t) => `<i class="${F.tams.has(t) ? 'on' : ''}">${esc(t)}</i>`).join('')}</div>` : ''}${precoHtml(p)}</div>
      <button class="bt-add" data-add="${p.id}" aria-label="Pôr na sacola">${ICONE_MAIS}</button>
    </article>`).join('') || `<div class="nada">${vazio}</div>`;
    const lv = g.querySelector('#limpar-vazio');
    if (lv) lv.onclick = () => { F.tams.clear(); F.cores.clear(); F.preco = ''; F.ordem = ''; desenharCats(); desenharGrade(); if (!$('#filtros').hidden) desenharFiltros(); };
    if (observador) observador.disconnect();
    observador = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('visivel'); observador.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    g.querySelectorAll('.peca').forEach((el) => (calmo ? el.classList.add('visivel') : observador.observe(el)));
  }
  desenharCats();
  desenharFavsTopo();
  desenharGrade();

  // ---------- Stories: bolinhas no topo com as novidades, promoções, vídeos… em tela cheia, uma depois da outra
  (() => {
    const tem = (p) => p.fotos.length || p.video;
    const grupos = [
      ['novas', 'Novidades', D.pecas.filter((p) => (p.chegou || p.novo) && tem(p))],
      ['promo', T && D.tema.id === 'black_friday' ? 'Black Friday' : 'Promoções', D.pecas.filter((p) => p.de && tem(p))],
      ['video', 'Vídeos', D.pecas.filter((p) => p.video)],
      ['giro', '360°', D.pecas.filter((p) => p.giro && p.giro.length && tem(p))],
      ['top', 'Mais vendidas', D.pecas.filter((p) => p.top && tem(p))],
    ].filter(([, , l]) => l.length).map(([k, nome, l]) => ({ k, nome, pecas: l.slice(0, 10) }));
    if (!grupos.length) return;
    const CHAVE_VISTOS = `stories-${D.loja}`;
    let vistos = {};
    try { vistos = JSON.parse(localStorage.getItem(CHAVE_VISTOS) || '{}'); } catch { vistos = {}; }
    const assinatura = (g) => g.pecas.map((p) => p.lk).join(',');
    const capa = (p) => p.fotos[0] || (p.mais && p.mais[0]) || '';
    const faixa = $('#stories');
    const desenharFaixa = () => {
      faixa.innerHTML = grupos.map((g, i) => `<button class="story ${vistos[g.k] === assinatura(g) ? 'visto' : ''} ${g.k === 'promo' && D.tema && D.tema.id === 'black_friday' ? 'bf' : ''}" data-g="${i}">
        <span class="story-anel"><span class="story-img">${capa(g.pecas[0]) ? `<img src="${capa(g.pecas[0])}" alt="" decoding="async">` : ICONE_PLAY}</span></span><small>${esc(g.nome)}</small></button>`).join('');
    };
    desenharFaixa();
    faixa.hidden = false;
    $('#hero').classList.add('com-stories');
    const tela = $('#story-tela');
    const midia = $('#story-midia');
    const barras = $('#story-barras');
    const som = $('#story-som');
    let S = null;
    let mudo = true;
    let raf = 0;
    const DUR = 5000;
    function mostrar() {
      const g = grupos[S.g];
      const p = g.pecas[S.i];
      vistos[g.k] = assinatura(g);
      try { localStorage.setItem(CHAVE_VISTOS, JSON.stringify(vistos)); } catch { /* ok */ }
      barras.innerHTML = g.pecas.map((_, i) => `<i><b style="width:${i < S.i ? 100 : 0}%"></b></i>`).join('');
      $('#story-av').innerHTML = capa(g.pecas[0]) ? `<img src="${capa(g.pecas[0])}" alt="">` : '';
      $('#story-grupo').textContent = g.nome;
      $('#story-cat').textContent = `${p.categoria} · nº ${p.num}`;
      $('#story-nome').textContent = p.nome;
      $('#story-preco').innerHTML = D.mostrarPreco ? `${p.de ? `<s>${brl(p.de)}</s> ` : ''}<b>${brl(p.preco)}</b>` : '';
      S.dur = DUR;
      S.passado = 0;
      S.inicio = performance.now();
      if (p.video) {
        midia.innerHTML = `<video src="${p.video}" ${mudo ? 'muted' : ''} playsinline autoplay preload="auto"></video>`;
        const v = midia.querySelector('video');
        S.video = v;
        v.onloadedmetadata = () => { S.dur = Math.min(15, v.duration || 5) * 1000; };
        v.onended = () => proxima(1);
        v.play().catch(() => { v.muted = true; mudo = true; v.play().catch(() => {}); });
        som.hidden = false;
        som.innerHTML = ICONE_SOM(mudo);
      } else {
        S.video = null;
        midia.innerHTML = `<img src="${capa(p)}" alt="" class="${calmo ? '' : 'kb'}">`;
        som.hidden = true;
      }
      // Já busca a próxima.
      const prox = g.pecas[S.i + 1] || (grupos[S.g + 1] && grupos[S.g + 1].pecas[0]);
      if (prox && capa(prox)) { const im = new Image(); im.src = capa(prox); }
    }
    function proxima(d) {
      if (!S) return;
      const g = grupos[S.g];
      if (d > 0 && S.i < g.pecas.length - 1) S.i += 1;
      else if (d > 0) { if (S.g >= grupos.length - 1) return fechar(); S.g += 1; S.i = 0; }
      else if (S.i > 0) S.i -= 1;
      else if (S.g > 0) { S.g -= 1; S.i = 0; } else S.i = 0;
      mostrar();
    }
    function tic(t) {
      if (!S) return;
      if (!S.pausado && !document.hidden) {
        const feito = S.video && S.video.duration ? Math.min(1, (S.video.currentTime * 1000) / S.dur) : Math.min(1, (S.passado + t - S.inicio) / S.dur);
        const b = barras.children[S.i] && barras.children[S.i].firstChild;
        if (b) b.style.width = `${feito * 100}%`;
        if (feito >= 1) { proxima(1); }
      }
      raf = requestAnimationFrame(tic);
    }
    function pausar(sim) {
      if (!S || S.pausado === sim) return;
      const agora = performance.now();
      if (sim) S.passado += agora - S.inicio; else S.inicio = agora;
      S.pausado = sim;
      if (S.video) { if (sim) S.video.pause(); else S.video.play().catch(() => {}); }
      tela.classList.toggle('pausado', sim);
    }
    function abrir(gi) {
      S = { g: gi, i: 0, pausado: false };
      tela.hidden = false;
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => tela.classList.add('aberta'));
      mostrar();
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(tic);
    }
    function fechar() {
      if (!S) return;
      S = null;
      cancelAnimationFrame(raf);
      tela.classList.remove('aberta');
      midia.querySelectorAll('video').forEach((v) => v.pause());
      if (cortina.hidden) document.body.style.overflow = '';
      setTimeout(() => { if (!S) { tela.hidden = true; midia.innerHTML = ''; } }, 250);
      desenharFaixa();
    }
    faixa.onclick = (e) => { const b = e.target.closest('[data-g]'); if (b) abrir(Number(b.dataset.g)); };
    $('#story-x').onclick = fechar;
    som.onclick = () => { mudo = !mudo; if (S && S.video) S.video.muted = mudo; som.innerHTML = ICONE_SOM(mudo); };
    $('#story-ver').onclick = () => { const p = grupos[S.g].pecas[S.i]; fechar(); abrirPeca(p.id); };
    // Toque rápido: anterior/próxima; segurar: pausa; arrastar para baixo: fecha.
    let toqueS = null;
    const caixa = $('#story-caixa');
    caixa.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.story-bt, #story-ver')) return;
      toqueS = { x: e.clientX, y: e.clientY, t: Date.now(), lado: e.target.closest('[data-sl]') };
      setTimeout(() => { if (toqueS && Date.now() - toqueS.t >= 190) pausar(true); }, 200);
    });
    caixa.addEventListener('pointerup', (e) => {
      if (!toqueS) return;
      const t = toqueS;
      toqueS = null;
      const dy = e.clientY - t.y;
      const dx = e.clientX - t.x;
      pausar(false);
      if (dy > 90 && Math.abs(dy) > Math.abs(dx)) return fechar();
      if (Math.abs(dx) > 60) return proxima(dx < 0 ? 1 : -1);
      if (Date.now() - t.t < 250 && t.lado) proxima(Number(t.lado.dataset.sl));
    });
    caixa.addEventListener('pointercancel', () => { toqueS = null; pausar(false); });
    tela.addEventListener('click', (e) => { if (e.target === tela) fechar(); });
    addEventListener('keydown', (e) => {
      if (!S) return;
      if (e.key === 'Escape') fechar();
      else if (e.key === 'ArrowRight') proxima(1);
      else if (e.key === 'ArrowLeft') proxima(-1);
      else if (e.key === ' ') { e.preventDefault(); pausar(!S.pausado); }
    });
  })();

  // ---------- Chegou essa semana (ou as novidades dos últimos dias)
  (() => {
    let lista = D.pecas.filter((p) => p.chegou);
    let titulo = 'Chegou essa semana';
    if (lista.length < 2) { lista = D.pecas.filter((p) => p.novo); titulo = 'Novidades da loja'; }
    if (lista.length < 2) return;
    lista = lista.slice().sort((a, b) => (b.fotos.length > 0) - (a.fotos.length > 0)).slice(0, 12);
    const sec = $('#chegou');
    const trilho = $('#chegou-trilho');
    sec.hidden = false;
    $('#chegou-titulo').textContent = titulo;
    trilho.innerHTML = lista.map((p, i) => `<article class="nov" data-id="${p.id}" style="--atraso:${Math.min(i, 6) * 0.08}s" tabindex="0">
      <div class="nov-foto">${p.fotos[0] ? `<img src="${p.fotos[0]}" alt="${esc(p.nome)}" loading="lazy" decoding="async" ${OK}>` : '<div class="sem">foto em breve</div>'}
        <span class="nov-tag">${p.chegou ? 'Chegou agora' : 'Novidade'}</span></div>
      <div class="nov-txt"><b>${esc(p.nome)}</b>${D.mostrarPreco ? `<span>${p.varia ? 'a partir de ' : ''}${brl(p.preco)}</span>` : ''}</div>
    </article>`).join('');
    if (calmo) sec.classList.add('visivel');
    else new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { sec.classList.add('visivel'); o.disconnect(); } }, { threshold: .15 }).observe(sec);
    trilho.addEventListener('click', (e) => { const c = e.target.closest('.nov'); if (c) abrirPeca(Number(c.dataset.id)); });
    trilho.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('nov')) abrirPeca(Number(e.target.dataset.id)); });
    sec.querySelector('.chegou-setas').onclick = (e) => {
      const b = e.target.closest('[data-s]');
      if (b) trilho.scrollBy({ left: Number(b.dataset.s) * trilho.clientWidth * .8, behavior: calmo ? 'auto' : 'smooth' });
    };
  })();

  // Ao chegar perto de uma peça, já vai buscando as fotos dela (a peça abre sem esperar).
  const buscadas = new Set();
  const preBuscar = (e) => {
    const c = e.target.closest && e.target.closest('[data-id]');
    if (!c || buscadas.has(c.dataset.id)) return;
    buscadas.add(c.dataset.id);
    const p = D.pecas.find((x) => x.id === Number(c.dataset.id));
    if (p) fotosDa(p).slice(0, 4).forEach((src) => { const i = new Image(); i.decoding = 'async'; i.src = src; });
  };
  for (const ev of ['pointerover', 'focusin', 'touchstart']) document.addEventListener(ev, preBuscar, { passive: true });

  // Inclinação 3D do cartão seguindo o mouse (ou o dedo).
  const grade = $('#grade');
  grade.addEventListener('pointermove', (e) => {
    if (calmo || e.pointerType === 'touch' || semMouse) return;
    const c = e.target.closest('.peca.visivel');
    if (!c) return;
    const r = c.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    c.classList.add('mexendo');
    c.style.transform = `perspective(900px) rotateY(${(x - .5) * 14}deg) rotateX(${(.5 - y) * 12}deg) scale(1.02)`;
    c.style.setProperty('--bx', `${x * 100}%`);
    c.style.setProperty('--by', `${y * 100}%`);

  grade.addEventListener('pointerout', (e) => {

  grade.addEventListener('click', (e) => {

    const c = e.target.closest('.peca');
    if (!c) return;
    const p = D.pecas.find((x) => x.id === Number(c.dataset.id));
    if (add && p.tamanhos.length <= 1 && p.cores.length <= 1) return porNaSacola(p, p.tamanhos[0] || '', p.cores[0] || '');
    abrirPeca(p.id);
  });

  // ---------- Provador (detalhe com foto que vira em 3D)
  const cortina = $('#cortina');
  const provador = $('#provador');
  function abrirPeca(id) {
    const p = D.pecas.find((x) => x.id === id);
    if (!p) return;

    let cor = p.cores.length === 1 ? p.cores[0] : '';
    let foto = 0;
    let virado = false;
    const temGiro = !!(p.giro && p.giro.length > 1);
    const lista = fotosDa(p);
    const tabMedidas = tabelaDe(p);
    provador.innerHTML = `
      <div class="prov-fotos">

        </div>
        ${temGiro ? '<div class="giro360" id="giro360"></div>' : ''}
        ${p.video ? `<div class="prov-video" id="prov-video" hidden><video src="${p.video}" loop muted playsinline preload="none"></video><button class="video-som" id="video-som" aria-label="Ligar o som">${ICONE_SOM(true)}</button></div>` : ''}
        ${lista.length ? `<button class="bt-lupa" id="prov-lupa" aria-label="Ver a foto de perto">${ICONE_LUPA}</button>` : ''}
        ${lista.length > 1 ? `<span class="prov-conta" id="prov-conta">1/${lista.length}</span>` : ''}
        ${lista.length > 1 || temGiro || p.video ? `<div class="prov-mini">${temGiro ? '<button data-g class="bt-360 sel" aria-label="Ver girando em 360°">360°</button>' : ''}${p.video ? `<button data-v class="bt-video" aria-label="Ver o vídeo">${ICONE_PLAY}<small>vídeo</small></button>` : ''}${lista.map((f, i) => `<button data-f="${i}" class="${i || temGiro ? '' : 'sel'}"><img src="${f}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>` : ''}
      </div>
      <div class="prov-txt">
        <span class="peca-cat">${esc(p.categoria)} · nº ${p.num}</span>
        <h2>${esc(p.nome)}</h2>
        <div class="selos" style="position:static;flex-direction:row;transform:none">${selos(p)}</div>
        ${precoHtml(p)}
        ${D.mostrarPreco && D.descontoPix ? `<span class="preco-pix-g">${ICONE_PIX}${brl(precoPix(p.preco))} <em>no Pix ou dinheiro</em></span>` : ''}
        ${p.tamanhos.length ? `<h4 class="h4-tam">Tamanho<b id="tam-esc">${tam ? `· ${esc(tam)}` : ''}</b>${tabMedidas ? '<button class="link-medidas" id="prov-medidas" type="button">📏 Qual o meu tamanho?</button>' : ''}</h4>
          ${tabMedidas ? `<div class="medidas" id="medidas" hidden>${medidasHtml(tabMedidas, p)}</div>` : ''}<div class="escolha" id="esc-tam">${p.tamanhos.map((t) => `<button data-t="${esc(t)}" class="${t === tam ? 'sel' : ''}">${esc(t)}</button>`).join('')}</div>` : ''}
        ${p.cores.length ? `<h4>Cor</h4><div class="escolha" id="esc-cor">${p.cores.map((c) => `<button data-c="${esc(c)}" class="${c === cor ? 'sel' : ''}">${esc(c)}</button>`).join('')}</div>` : ''}
        ${D.mostrarPreco ? pagamentosValorHtml(p.preco) : ''}
        ${D.pedidos ? `<span class="prov-retira">${ICONE_RELOGIO} Separamos por ${D.prazoReserva} dias no seu nome · você paga na loja</span>` : ''}
        <span class="aviso-escolha" id="aviso-escolha" hidden></span>
        <div class="prov-acoes">
          ${coracao(p, 'bt-fav bt-fav-g')}
          <button class="bt-sacola-g" id="prov-sacola" aria-label="Pôr na sacola" title="Pôr na sacola">${ICONE_LOJA}<b>+</b></button>
          ${D.pedidos ? `<button class="bt-ouro bt-reservar" id="prov-quero">${ICONE_LOJA} Finalizar reserva</button>`
            : D.whatsapp ? '<button class="bt-ouro bt-reservar" id="prov-quero">Quero essa! (WhatsApp)</button>' : ''}
        </div>
      </div>
      <button class="compartilhar" id="prov-link" aria-label="Compartilhar esta peça">${ICONE_LINK}<span>Compartilhar</span></button>
      <button class="fechar" id="prov-fechar" aria-label="Fechar">${ICONE_X}</button>`;
    cortina.hidden = false;
    provador.scrollTop = 0;
    requestAnimationFrame(() => cortina.classList.add('aberta'));
    document.body.style.overflow = 'hidden';
    const cartao = provador.querySelector('#prov-cartao');
    const giro = provador.querySelector('#giro360');
    if (giro) montarGiro(giro, p.giro);
    const fotosEl = provador.querySelector('.prov-fotos');
    fotosEl.classList.toggle('girando', !!giro);
    const vid = provador.querySelector('#prov-video');
    const video = vid && vid.querySelector('video');
    const verVideo = (sim) => {
      if (!vid) return;
      vid.hidden = !sim;
      fotosEl.classList.toggle('girando', sim || !!(giro && !giro.hidden));
      provador.querySelectorAll('[data-v]').forEach((b) => b.classList.toggle('sel', sim));
      if (sim) {
        if (giro) { giro.hidden = true; provador.querySelectorAll('[data-g]').forEach((b) => b.classList.remove('sel')); }
        provador.querySelectorAll('[data-f]').forEach((b) => b.classList.remove('sel'));
        video.play().catch(() => {});
      } else video.pause();
    };
    if (vid) {
      vid.querySelector('#video-som').onclick = (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
        e.currentTarget.innerHTML = ICONE_SOM(video.muted);
      };
    }
    const verGiro = (sim) => {
      if (!giro) return;
      if (sim) verVideo(false);
      giro.hidden = !sim;
      fotosEl.classList.toggle('girando', sim);
      provador.querySelectorAll('[data-g]').forEach((b) => b.classList.toggle('sel', sim));
      if (sim) provador.querySelectorAll('[data-f]').forEach((b) => b.classList.remove('sel'));
    };
    const trocarFoto = (i) => {
      if (vid && !vid.hidden) {
        verVideo(false);
        if (i === foto) { provador.querySelectorAll('[data-f]').forEach((b) => b.classList.toggle('sel', Number(b.dataset.f) === i)); return; }
      }
      if (giro && !giro.hidden) {
        verGiro(false);
        if (i === foto) { provador.querySelectorAll('[data-f]').forEach((b) => b.classList.toggle('sel', Number(b.dataset.f) === i)); return; }
      }
      if (i === foto || !lista[i]) return;
      foto = i;
      virado = !virado;
      cartao.querySelector(virado ? '.verso img' : '.prov-face:not(.verso) img').src = lista[i];
      cartao.style.transform = ''; // a inclinação do mouse não pode segurar a foto antiga
      cartao.classList.toggle('virado', virado);
      provador.querySelectorAll('[data-f]').forEach((b) => b.classList.toggle('sel', Number(b.dataset.f) === i));
      const sel = provador.querySelector(`[data-f="${i}"]`);
      if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: calmo ? 'auto' : 'smooth' });
      const conta = provador.querySelector('#prov-conta');
      if (conta) conta.textContent = `${i + 1}/${lista.length}`;
    };
    // Passar as fotos com o dedo (ou arrastando com o mouse); um toque sem arrastar abre a lupa.
    let toque = null;
    fotosEl.addEventListener('dragstart', (e) => e.preventDefault());
    fotosEl.addEventListener('pointerdown', (e) => {
      if ((giro && !giro.hidden) || e.target.closest('button')) return;
      if (vid && !vid.hidden) return;
      toque = { x: e.clientX, y: e.clientY, t: Date.now() };
    });
    fotosEl.addEventListener('pointerup', (e) => {
      if (!toque) return;
      const dx = e.clientX - toque.x;
      const dy = e.clientY - toque.y;
      const t = toque;
      toque = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        if (lista.length > 1) trocarFoto((foto + (dx < 0 ? 1 : -1) + lista.length) % lista.length);
      } else if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - t.t < 400 && lista.length) {
        abrirLupa(lista, foto, (i) => trocarFoto(i));
      }
    });
    fotosEl.addEventListener('pointercancel', () => { toque = null; });
    const marcarTam = () => {
      const el = provador.querySelector('#tam-esc');
      if (el) el.textContent = tam ? `· ${tam}` : '';
      if (tam) provador.querySelector('#aviso-escolha').hidden = true;
    };
    const ok = () => {
      const falta = [p.tamanhos.length && !tam && 'o tamanho', p.cores.length && !cor && 'a cor'].filter(Boolean);
      const av = provador.querySelector('#aviso-escolha');
      av.hidden = !falta.length;
      av.textContent = falta.length ? `Escolha ${falta.join(' e ')} 😉` : '';
      return !falta.length;
    };
    provador.onclick = (e) => {
      const f = e.target.closest('[data-f]');
      if (f) return trocarFoto(Number(f.dataset.f));
      if (e.target.closest('[data-g]')) return verGiro(true);
      if (e.target.closest('[data-v]')) return verVideo(true);
      const fv = e.target.closest('[data-fav]');
      if (fv) return marcarFav(Number(fv.dataset.fav));
      if (e.target.closest('#prov-medidas')) {
        const m = provador.querySelector('#medidas');
        m.hidden = !m.hidden;
        if (!m.hidden) { const i = m.querySelector('input'); if (i && !toqueTela) i.focus(); }
        return;
      }
      if (e.target.closest('#prov-link')) return compartilhar(p);
      if (e.target.closest('#prov-lupa')) return abrirLupa(lista, foto, (i) => trocarFoto(i));
      const t = e.target.closest('[data-t]');
      if (t) { tam = t.dataset.t; provador.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('sel', b === t)); marcarTam(); return; }
      const c = e.target.closest('#esc-cor [data-c]');
      if (c) { cor = c.dataset.c; provador.querySelectorAll('#esc-cor [data-c]').forEach((b) => b.classList.toggle('sel', b === c)); return; }
      if (e.target.closest('#prov-fechar')) return fecharPeca();
      if (e.target.closest('#prov-sacola')) { if (ok()) { porNaSacola(p, tam, cor); fecharPeca(); } return; }
      if (e.target.closest('#prov-quero')) {
        if (!ok()) return;
        if (D.pedidos) {
          porNaSacola(p, tam, cor);
          fecharPeca();
          abrirGaveta('dados');
          return setTimeout(() => { const i = $('#form-pedido [name=nome]'); if (i && !i.value && !toqueTela) i.focus(); }, 350);
        }
        window.open(zap(`Oi! Vi no catálogo e quero:\n• nº ${p.num} ${p.nome}${tam ? ` — Tam ${tam}` : ''}${cor ? ` · ${cor}` : ''}${D.mostrarPreco ? ` — ${brl(p.preco)}` : ''}`), '_blank');
      }
    };
    // "Qual o meu tamanho?": a cliente escreve as medidas e o site sugere (e já escolhe) o tamanho.
    const med = provador.querySelector('#medidas');
    if (med) {
      med.addEventListener('input', () => {
        const valores = [...med.querySelectorAll('input')].map((i) => Number(String(i.value).replace(',', '.')) || 0);
        const r = med.querySelector('#medidas-r');
        if (!valores.some(Boolean)) { r.innerHTML = ''; return; }
        const sug = sugerirTamanho(tabMedidas, valores);
        med.querySelectorAll('tbody tr').forEach((tr) => tr.classList.toggle('sugerido', !!sug && tr.dataset.t === sug));
        if (!sug) { r.innerHTML = 'Suas medidas passam do maior tamanho da tabela. Fale com a gente no WhatsApp que a gente te ajuda 💬'; return; }
        const tem = p.tamanhos.includes(sug);
        r.innerHTML = tem ? `O seu tamanho é <b>${esc(sug)}</b> ✓ e tem nesta peça!` : `O seu tamanho é <b>${esc(sug)}</b>, mas esta peça não tem ele agora 😢`;
        if (tem) {
          tam = sug;
          provador.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('sel', b.dataset.t === sug));
          marcarTam();
        }
      });
    }
    // Inclinação da foto acompanhando o mouse.
    const fotos = provador.querySelector('.prov-fotos');
    fotos.onpointermove = (e) => {
      if (calmo || e.pointerType === 'touch' || (giro && !giro.hidden)) return;
      const r = fotos.getBoundingClientRect();
      cartao.style.transform = `${virado ? 'rotateY(180deg) ' : ''}rotateY(${((e.clientX - r.left) / r.width - .5) * 10}deg) rotateX(${(.5 - (e.clientY - r.top) / r.height) * 8}deg)`;
    };
    fotos.onpointerleave = () => { cartao.style.transform = ''; };
  }
  // ---------- Tabela de medidas (a da loja): letras (P, M, G) ou números (36, 38…), conforme os tamanhos da peça
  const ehNumero = (t) => /^\d+([.,]\d+)?$/.test(String(t).trim());
  function tabelaDe(p) {
    if (!D.medidas || !p.tamanhos.length) return null;
    const t = p.tamanhos.every(ehNumero) ? D.medidas.numeros : D.medidas.letras;
    return t && t.linhas.some((l) => p.tamanhos.includes(l[0])) ? t : null;
  }
  const maiorDe = (v) => Math.max(...(String(v).replace(',', '.').match(/\d+(\.\d+)?/g) || ['0']).map(Number));
  function sugerirTamanho(t, valores) {
    const l = t.linhas.find((linha) => valores.every((v, i) => !v || !maiorDe(linha[i + 1]) || v <= maiorDe(linha[i + 1]) + 1));
    return l ? l[0] : '';
  }
  function medidasHtml(t, p) {
    return `<table><thead><tr><th>Tam</th>${t.colunas.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${t.linhas.map((l) => `<tr data-t="${esc(l[0])}" class="${p.tamanhos.includes(l[0]) ? 'tem' : ''}"><th>${esc(l[0])}</th>${l.slice(1).map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <small class="medidas-nota">Medidas do corpo, em centímetros. Em negrito, os tamanhos que esta peça tem.</small>
      <div class="medidas-ajuda"><b>Me ajuda a escolher</b><div class="medidas-campos">${t.colunas.map((c) => `<label>${esc(c)}<input type="number" inputmode="decimal" min="30" max="200" placeholder="cm"></label>`).join('')}</div>
      <p class="medidas-r" id="medidas-r"></p></div>`;
  }

  /** Giro de 360°: as fotos em volta do manequim; gira sozinho até a cliente arrastar. */
  function montarGiro(el, quadros) {
    const n = quadros.length;
    el.innerHTML = `<img alt="" draggable="false"><span class="giro360-carga" style="width:0"></span><span class="giro360-dica">${ICONE_GIRO} arraste para girar</span>`;
    const img = el.querySelector('img');
    const carga = el.querySelector('.giro360-carga');
    let prontos = 0;
    quadros.forEach((src) => {
      const i = new Image();
      i.onload = i.onerror = () => { prontos += 1; carga.style.width = `${(prontos / n) * 100}%`; if (prontos >= n) carga.style.opacity = 0; };
      i.src = src;
    });
    let q = 0;
    const mostrar = (i) => { q = ((i % n) + n) % n; img.src = quadros[q]; };
    mostrar(0);
    let auto = !calmo;
    let t0 = 0;
    const passo = (t) => {
      if (!auto || !el.isConnected) return;
      if (prontos < n || el.hidden) t0 = t - q * 110; else mostrar(Math.floor((t - t0) / 110));
      requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
    let arr = null;
    el.onpointerdown = (e) => { auto = false; el.classList.add('mexeu'); arr = { x: e.clientX, q }; el.setPointerCapture(e.pointerId); };
    el.onpointermove = (e) => {
      if (!arr) return;
      const px = Math.max(6, (el.clientWidth * 1.2) / n);
      mostrar(arr.q - Math.round((e.clientX - arr.x) / px));
    };
    el.onpointerup = el.onpointercancel = () => { arr = null; };
  }

  /** Link da peça (abre o catálogo já nela; no WhatsApp aparece a foto). */
  function compartilhar(p) {
    const base = location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '');
    const url = `${base}${base.endsWith('/') ? '' : '/'}p/${p.lk}/`;
    const texto = `Olha essa peça da ${D.loja}: ${p.nome} 💕`;
    if (navigator.share) { navigator.share({ title: p.nome, text: texto, url }).catch(() => {}); return; }
    const copiado = () => toast('Link da peça copiado 🔗');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(copiado, () => prompt('Copie o link da peça:', url));
    else prompt('Copie o link da peça:', url);
  }

  // ---------- Lupa: a foto em tela cheia; dois dedos (ou duplo toque, clique, rodinha) aproximam
  const lupa = $('#lupa');
  const lpalco = $('#lupa-palco');
  const limg = $('#lupa-img');
  let L = null;
  const limite = (v, a, b) => Math.min(b, Math.max(a, v));
  const toqueTela = matchMedia('(pointer: coarse)').matches;
  function aplicarLupa(anim = true) {
    const w = lpalco.clientWidth;
    const h = lpalco.clientHeight;
    L.x = limite(L.x, -w * (L.s - 1) / 2, w * (L.s - 1) / 2);
    L.y = limite(L.y, -h * (L.s - 1) / 2, h * (L.s - 1) / 2);
    limg.style.transition = anim && !calmo ? 'transform .25s cubic-bezier(.2,.8,.2,1)' : 'none';
    limg.style.transform = `translate(${L.x}px, ${L.y}px) scale(${L.s})`;
    lupa.classList.toggle('perto', L.s > 1.01);
  }
  /** Aproxima mantendo parado o ponto debaixo do dedo/mouse. */
  function zoomEm(cx, cy, s) {
    const r = lpalco.getBoundingClientRect();
    const px = cx - r.left - r.width / 2;
    const py = cy - r.top - r.height / 2;
    L.x = px - ((px - L.x) * s) / L.s;
    L.y = py - ((py - L.y) * s) / L.s;
    L.s = s;
  }
  function mostrarLupa() {
    limg.src = L.lista[L.i];
    L.s = 1; L.x = 0; L.y = 0;
    aplicarLupa(false);
    const varias = L.lista.length > 1;
    lupa.querySelectorAll('.lupa-seta').forEach((b) => { b.hidden = !varias; });
    $('#lupa-conta').textContent = varias ? `${L.i + 1} / ${L.lista.length}` : '';
  }
  function irLupa(d) {
    if (!L || L.lista.length < 2) return;
    L.i = (L.i + d + L.lista.length) % L.lista.length;
    mostrarLupa();
  }
  function abrirLupa(lista, i, aoFechar) {
    if (!lista.length) return;
    L = { lista, i, aoFechar, s: 1, x: 0, y: 0 };
    lupa.hidden = false;
    $('#lupa-dica').textContent = toqueTela ? 'Use dois dedos ou toque duas vezes para aproximar' : 'Clique ou use a rodinha do mouse para aproximar';
    mostrarLupa();
    requestAnimationFrame(() => lupa.classList.add('aberta'));
  }
  function fecharLupa() {
    if (!L) return;
    const { aoFechar, i } = L;
    L = null;
    lupa.classList.remove('aberta');
    setTimeout(() => { if (!L) lupa.hidden = true; }, 260);
    if (aoFechar) aoFechar(i);
  }
  $('#lupa-fechar').onclick = fecharLupa;
  lupa.querySelectorAll('.lupa-seta').forEach((b) => { b.onclick = () => irLupa(Number(b.dataset.l)); });
  const dedos = new Map();
  let gesto = null;
  let ultimoToque = 0;
  const centroDedos = () => { const [a, b] = [...dedos.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) || 1 }; };
  const comecarGesto = () => {
    if (dedos.size >= 2) { const c = centroDedos(); gesto = { tipo: 'pinca', c, s: L.s, x: L.x, y: L.y }; return; }
    const [d] = [...dedos.values()];
    gesto = d ? { tipo: 'um', x0: d.x, y0: d.y, x: L.x, y: L.y, t: Date.now(), moveu: false } : null;
  };
  lpalco.addEventListener('pointerdown', (e) => {
    if (!L) return;
    lpalco.setPointerCapture(e.pointerId);
    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    comecarGesto();
  });
  lpalco.addEventListener('pointermove', (e) => {
    if (!L || !dedos.has(e.pointerId) || !gesto) return;
    dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesto.tipo === 'pinca' && dedos.size >= 2) {
      const c = centroDedos();
      L.s = gesto.s; L.x = gesto.x; L.y = gesto.y;
      zoomEm(gesto.c.x, gesto.c.y, limite((gesto.s * c.d) / gesto.c.d, 1, 4));
      L.x += c.x - gesto.c.x;
      L.y += c.y - gesto.c.y;
      aplicarLupa(false);
      return;
    }
    if (gesto.tipo !== 'um') return;
    const dx = e.clientX - gesto.x0;
    const dy = e.clientY - gesto.y0;
    if (Math.abs(dx) + Math.abs(dy) > 6) gesto.moveu = true;
    if (L.s > 1.01) { L.x = gesto.x + dx; L.y = gesto.y + dy; aplicarLupa(false); } else if (L.lista.length > 1) {
      limg.style.transition = 'none';
      limg.style.transform = `translateX(${dx * .6}px)`;
    }
  });
  const soltarDedo = (e) => {
    if (!L || !dedos.has(e.pointerId)) return;
    const pos = dedos.get(e.pointerId);
    dedos.delete(e.pointerId);
    const g = gesto;
    if (g && g.tipo === 'um') {
      const dx = pos.x - g.x0;
      if (!g.moveu) {
        const agora = Date.now();
        const duplo = agora - ultimoToque < 320;
        ultimoToque = duplo ? 0 : agora;
        if (e.pointerType === 'mouse' || duplo) {
          if (L.s > 1.01) { L.s = 1; L.x = 0; L.y = 0; } else zoomEm(pos.x, pos.y, 2.5);
          aplicarLupa();
        }
      } else if (L.s <= 1.01) {
        if (Math.abs(dx) > 50 && L.lista.length > 1) irLupa(dx < 0 ? 1 : -1); else aplicarLupa();
      }
    }
    if (dedos.size) comecarGesto(); else gesto = null;
    if (L && L.s < 1.05 && !dedos.size) { L.s = 1; aplicarLupa(); }
  };
  lpalco.addEventListener('pointerup', soltarDedo);
  lpalco.addEventListener('pointercancel', soltarDedo);
  lpalco.addEventListener('wheel', (e) => {
    if (!L) return;
    e.preventDefault();
    zoomEm(e.clientX, e.clientY, limite(L.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 1, 4));
    aplicarLupa(false);
  }, { passive: false });

  function fecharPeca() {
    provador.querySelectorAll('video').forEach((v) => v.pause());
    if (/^#peca-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    cortina.classList.remove('aberta');
    document.body.style.overflow = '';
    setTimeout(() => { cortina.hidden = true; }, 300);
  }
  cortina.addEventListener('click', (e) => { if (e.target === cortina) fecharPeca(); });
  addEventListener('keydown', (e) => {
    if (L) {
      if (e.key === 'Escape') fecharLupa();
      else if (e.key === 'ArrowRight') irLupa(1);
      else if (e.key === 'ArrowLeft') irLupa(-1);
      return;
    }
    if (e.key === 'Escape') { if (!cortina.hidden) fecharPeca(); fecharGaveta(); }
  });
  // Link direto da peça (…/#peca-123): abre o catálogo já nela.
  const abrirDoLink = () => {
    const m = /^#peca-(\d+)$/.exec(location.hash);
    if (!m) return;
    const p = D.pecas.find((x) => x.lk === Number(m[1]));
    if (p) abrirPeca(p.id);
    else { toast('Essa peça já foi vendida 😢 Veja as outras!'); history.replaceState(null, '', location.pathname + location.search); }
  };
  setTimeout(abrirDoLink, calmo ? 0 : 1100);
  addEventListener('hashchange', abrirDoLink);

  // ---------- Sacola (vai para o WhatsApp numa mensagem só)
  const CHAVE = `sacola-${D.loja}`;
  let sacola = [];
  try { sacola = JSON.parse(localStorage.getItem(CHAVE) || '[]').filter((x) => D.pecas.some((p) => p.id === x.id)); } catch { sacola = []; }
  const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(sacola)); } catch { /* só nesta visita */ } };
  const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('ver'), 2200); };
  function porNaSacola(p, tam, cor) {
    sacola.push({ id: p.id, tam, cor });
    gravar();
    desenharSacola();
    const b = $('#bt-sacola');
    b.classList.remove('pula'); void b.offsetWidth; b.classList.add('pula');
    toast(`${p.nome} está na sacola 🛍️`);
  }
  let etapa = 'sacola'; // sacola → dados → feito
  let ultimoPedido = null;
  const ICONE_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  let fotoCliente = null; // foto da cliente (data URL pequena), só nesta visita
  const cpfValido = (d) => {
    if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
    for (const n of [9, 10]) {
      let soma = 0;
      for (let i = 0; i < n; i++) soma += Number(d[i]) * (n + 1 - i);
      if (((soma * 10) % 11) % 10 !== Number(d[n])) return false;
    }
    return true;
  };
  const mascaraCpf = (v) => v.replace(/\D/g, '').slice(0, 11).replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  /** Diminui a foto para um quadrado de rosto (pequeno, para caber no pedido). */
  function reduzirFoto(arquivo) {
    return new Promise((ok, falha) => {
      const url = URL.createObjectURL(arquivo);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const lado = Math.min(img.naturalWidth, img.naturalHeight);
        const tela = document.createElement('canvas');
        let tam = 200;
        let q = 0.72;
        let dados = '';
        for (let tentativa = 0; tentativa < 8; tentativa++) {
          tela.width = tela.height = tam;
          const ctx = tela.getContext('2d');
          ctx.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 3, lado, lado, 0, 0, tam, tam);
          dados = tela.toDataURL('image/jpeg', q);
          if (dados.length <= 12000) return ok(dados);
          if (q > 0.5) q -= 0.1; else tam = Math.round(tam * 0.85);
        }
        ok(dados.length <= 14000 ? dados : null);
      };
      img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('foto')); };
      img.src = url;
    });
  }
  const lembrar = (() => { try { return JSON.parse(localStorage.getItem(`${CHAVE}-cliente`) || '{}'); } catch { return {}; } })();
  function desenharSacola() {
    const n = sacola.length;
    $('#sacola-n').hidden = !n;
    $('#sacola-n').textContent = n;
    const lista = $('#gaveta-lista');
    const pe = $('#gaveta-pe');
    if (etapa === 'feito' && ultimoPedido) {
      lista.innerHTML = `<div class="feito"><span class="ok">${ICONE_OK}</span><h4>Reserva feita!</h4>
        <span class="cod">${esc(ultimoPedido.codigo)}</span>
        <p>Suas peças estão separadas na loja por <b>${D.prazoReserva} dias</b>, no seu nome.<br>A loja vai te chamar no WhatsApp para combinar o pagamento e a retirada ou entrega.</p>
        ${D.mostrarPreco ? pagamentosHtml() : ''}</div>`;
      pe.innerHTML = D.whatsapp ? `<a class="bt-zap" target="_blank" rel="noopener" href="${zap(`Oi! Fiz o pedido nº ${ultimoPedido.codigo} pelo site 💕`)}">Falar com a loja no WhatsApp</a>` : '';
      return;
    }
    const itens = sacola.map((x, i) => ({ ...x, i, p: D.pecas.find((p) => p.id === x.id) }));
    const total = itens.reduce((a, x) => a + x.p.preco, 0);
    if (etapa === 'dados' && itens.length) {
      lista.innerHTML = `<form class="form-pedido" id="form-pedido" novalidate>
        <p style="margin:0;color:var(--suave)">${n} peça${n === 1 ? '' : 's'}${D.mostrarPreco ? ` · <b style="color:var(--rosa-escuro)">${brl(total)}</b>` : ''}. Seus dados para a loja falar com você:</p>
        <label>Seu nome<input name="nome" autocomplete="name" maxlength="80" value="${esc(lembrar.nome || '')}" required></label>
        <label>WhatsApp (com DDD)<input name="telefone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(63) 99999-9999" value="${esc(lembrar.telefone || '')}" required></label>
        <label>CPF<input name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required></label>
        <div class="foto-cliente">
          <label class="foto-cliente-bola" for="foto-cliente" aria-label="Escolher sua foto">${fotoCliente ? `<img src="${fotoCliente}" alt="">` : ICONE_CAMERA}</label>
          <div><b>Sua foto <small>(opcional)</small></b><span>Ajuda a loja a te reconhecer na retirada.</span>
            <label class="foto-cliente-bt" for="foto-cliente">${fotoCliente ? 'Trocar foto' : 'Tirar ou escolher foto'}</label>${fotoCliente ? ' <button type="button" class="foto-cliente-tirar" id="foto-tirar">Remover</button>' : ''}</div>
          <input type="file" id="foto-cliente" accept="image/*" capture="user" hidden>
        </div>
        <label>Observação (opcional)<textarea name="observacao" rows="3" maxlength="300" placeholder="Ex.: vou buscar no sábado / quero entrega no centro"></textarea></label>
        <label class="consente"><input type="checkbox" name="consente"> <span>Autorizo a ${esc(D.loja)} a guardar meus dados no cadastro de clientes para esta reserva.</span></label>
        <span class="erro" id="erro-pedido" hidden></span>
      </form>`;
      pe.innerHTML = '<button class="bt-pedido" id="confirmar-pedido">Confirmar reserva</button><button class="bt-voltar" id="voltar-sacola">← Voltar para a sacola</button>';
      return;
    }
    etapa = 'sacola';
    lista.innerHTML = itens.length ? itens.map(({ p, tam, cor, i }) => `<div class="item">
      ${p.fotos[0] ? `<img src="${p.fotos[0]}" alt="">` : '<span class="sem"></span>'}
      <div><b>${esc(p.nome)}</b><small>nº ${p.num}${tam ? ` · Tam ${esc(tam)}` : ''}${cor ? ` · ${esc(cor)}` : ''}${D.mostrarPreco ? ` · ${brl(p.preco)}` : ''}</small></div>
      <button data-rm="${i}" aria-label="Tirar">${ICONE_X}</button></div>`).join('')
      : '<div class="gaveta-vazia">Sua sacola está vazia.<br>Toque no <b>+</b> das peças que gostar.</div>';
    pe.innerHTML = itens.length ? `${D.mostrarPreco ? `<div class="gaveta-total"><span>${n} peça${n === 1 ? '' : 's'}</span><b>${brl(total)}</b></div>
      ${pagamentosValorHtml(total)}` : ''}
      ${D.pedidos ? `<button class="bt-pedido" id="finalizar">${ICONE_LOJA.replace('<svg', '<svg width="20" height="20"')} Finalizar reserva</button>` : ''}
      ${D.whatsapp ? `<button class="bt-zap" id="enviar-pedido" ${D.pedidos ? 'style="background:#fff;color:#1a7f45;border:1.5px solid #25d366;box-shadow:none"' : ''}>${D.pedidos ? 'Ou mandar a lista no WhatsApp' : 'Enviar pedido no WhatsApp'}</button>` : ''}` : '';
  }

  /** Manda o pedido para a caixa de pedidos da loja (Google). */
  async function enviarPedido(pedido) {
    const corpo = JSON.stringify(pedido);
    try {
      const r = await fetch(D.pedidos, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: corpo });
      const j = await r.json();
      return !!j.ok;
    } catch {
      // Sem como ler a resposta (CORS): manda de novo "às cegas". Se chegar duas vezes, a loja recebe uma só (mesmo código).
      try { await fetch(D.pedidos, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: corpo }); return true; } catch { return false; }
    }
  }
  const novoCodigo = () => {
    const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const v = new Uint8Array(6);
    (window.crypto || window.msCrypto).getRandomValues(v);
    return [...v].map((x) => letras[x % letras.length]).join('');
  };
  async function confirmarPedido() {
    const f = $('#form-pedido');
    const err = $('#erro-pedido');
    const nome = f.nome.value.trim();
    const tel = f.telefone.value.trim();
    const dig = tel.replace(/\D/g, '');
    const cpf = f.cpf.value.replace(/\D/g, '');
    const falta = !nome ? 'Escreva seu nome.' : dig.length < 10 || dig.length > 13 ? 'Escreva seu WhatsApp com DDD.'
      : !cpfValido(cpf) ? 'Confira o seu CPF (11 números).' : !f.consente.checked ? 'Marque a autorização para a loja guardar seus dados.' : '';
    err.hidden = !falta;
    err.textContent = falta;
    if (falta) return;
    const b = $('#confirmar-pedido');
    b.disabled = true;
    b.textContent = 'Enviando…';
    const itens = sacola.map((x) => {
      const p = D.pecas.find((y) => y.id === x.id);
      const v = p.variantes.find((y) => y.t === (x.tam || '') && y.c === (x.cor || '')) || p.variantes.find((y) => y.t === (x.tam || '')) || p.variantes[0] || { id: p.id };
      return { id: v.id, nome: p.nome, tam: x.tam || '', cor: x.cor || '', preco: p.preco };
    });
    const pedido = { codigo: novoCodigo(), nome, telefone: tel, cpf, observacao: f.observacao.value.trim(), itens, total: itens.reduce((a, x) => a + x.preco, 0), enviado: new Date().toISOString() };
    // A caixa de pedidos aceita até 20 mil letras por pedido: a foto vai junto só se couber.
    if (fotoCliente && JSON.stringify({ ...pedido, foto: fotoCliente }).length < 19500) pedido.foto = fotoCliente;
    const ok = await enviarPedido(pedido);
    if (!ok) {
      b.disabled = false;
      b.textContent = 'Confirmar reserva';
      err.hidden = false;
      err.textContent = 'Não consegui enviar agora (sem internet?). Tente de novo ou mande a lista no WhatsApp.';
      return;
    }
    try { localStorage.setItem(`${CHAVE}-cliente`, JSON.stringify({ nome, telefone: tel })); } catch { /* ok */ }
    lembrar.nome = nome; lembrar.telefone = tel;
    ultimoPedido = pedido;
    sacola = [];
    gravar();
    etapa = 'feito';
    desenharSacola();
  }
  desenharSacola();
  const gaveta = $('#gaveta');
  const fecharGaveta = () => {
    gaveta.classList.remove('aberta');
    if (etapa === 'feito') { etapa = 'sacola'; setTimeout(desenharSacola, 400); }
  };
  const abrirGaveta = (passo) => { if (passo) etapa = passo; desenharSacola(); gaveta.classList.add('aberta'); };
  $('#bt-sacola').onclick = () => abrirGaveta(etapa === 'feito' ? 'feito' : 'sacola');
  $('#fechar-gaveta').onclick = fecharGaveta;
  gaveta.addEventListener('submit', (e) => { e.preventDefault(); confirmarPedido(); });
  gaveta.addEventListener('input', (e) => {
    if (e.target.name === 'cpf') e.target.value = mascaraCpf(e.target.value);
  });
  gaveta.addEventListener('change', async (e) => {
    if (e.target.id !== 'foto-cliente' || !e.target.files[0]) return;
    const f = $('#form-pedido');
    const guardar = f ? Object.fromEntries(['nome', 'telefone', 'cpf', 'observacao'].map((k) => [k, f[k].value])) : null;
    const consente = f && f.consente.checked;
    try {
      fotoCliente = await reduzirFoto(e.target.files[0]);
      if (!fotoCliente) toast('Não consegui usar essa foto. Tente outra 📷');
    } catch { toast('Não consegui abrir essa foto. Tente outra 📷'); }
    desenharSacola();
    const g = $('#form-pedido');
    if (g && guardar) { for (const [k, v] of Object.entries(guardar)) g[k].value = v; g.consente.checked = consente; }
  });
  gaveta.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rm]');
    if (rm) { sacola.splice(Number(rm.dataset.rm), 1); gravar(); return desenharSacola(); }
    if (e.target.closest('#finalizar')) { etapa = 'dados'; desenharSacola(); setTimeout(() => { const i = $('#form-pedido [name=nome]'); if (i && !i.value) i.focus(); }, 300); return; }
    if (e.target.closest('#voltar-sacola')) { etapa = 'sacola'; return desenharSacola(); }
    if (e.target.closest('#foto-tirar')) {
      const f = $('#form-pedido');
      const guardar = Object.fromEntries(['nome', 'telefone', 'cpf', 'observacao'].map((k) => [k, f[k].value]));
      const consente = f.consente.checked;
      fotoCliente = null;
      desenharSacola();
      const g = $('#form-pedido');
      for (const [k, v] of Object.entries(guardar)) g[k].value = v;
      g.consente.checked = consente;
      return;
    }
    if (e.target.closest('#confirmar-pedido')) { confirmarPedido(); return; }
    if (e.target.closest('#enviar-pedido')) {
      const linhas = sacola.map((x) => {
        const p = D.pecas.find((y) => y.id === x.id);
        return `• nº ${p.num} ${p.nome}${x.tam ? ` — Tam ${x.tam}` : ''}${x.cor ? ` · ${x.cor}` : ''}${D.mostrarPreco ? ` — ${brl(p.preco)}` : ''}`;
      });
      const total = sacola.reduce((a, x) => a + (D.pecas.find((y) => y.id === x.id) || { preco: 0 }).preco, 0);
      window.open(zap(`Oi! Vi o catálogo e quero estas peças:\n${linhas.join('\n')}${D.mostrarPreco ? `\nTotal: ${brl(total)}` : ''}`), '_blank');
    }
  });
})();
</script>
</body>
